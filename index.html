<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demet'in Sinema Odası</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .header { margin-top: 15px; margin-bottom: 20px; }
        .header h1 { color: #ff4d6d; font-size: 1.8rem; margin-bottom: 5px; }
        .header p { color: #a0a0a0; font-size: 0.9rem; }
        .card { background: #1e1e1e; border-radius: 16px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #2a2a2a; display: none; margin-bottom: 25px; margin-top: 15px; }
        
        /* Poster Çerçeve Standardı */
        .poster-container { width: 100%; height: 420px; background-color: #121212; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .poster { width: 100%; height: 100%; object-fit: cover; display: block; border-bottom: 2px solid #2a2a2a; }
        
        .content { padding: 20px; }
        .title { font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .genre { font-size: 0.8rem; color: #ff4d6d; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .meta { display: flex; justify-content: center; gap: 15px; margin-bottom: 12px; font-size: 0.9rem; color: #ffb703; }
        .overview { font-size: 0.9rem; color: #ccc; line-height: 1.4; margin-bottom: 20px; text-align: left; }
        .btn-trailer { display: inline-block; width: 100%; padding: 12px; background-color: #ff0000; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
        .btn-main { background: linear-gradient(135deg, #ff4d6d, #c9184a); color: white; border: none; padding: 16px 32px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4); transition: transform 0.2s; }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 Demet'in Sinema Odası</h1>
        <p>Bugün ne izlesek diye düşünmeye son!</p>
    </div>

    <button class="btn-main" onclick="fetchRandomMovie()">🎲 Rastgele Film Getir</button>

    <div class="card" id="movieCard">
        <div class="poster-container">
            <img src="" alt="Poster" class="poster" id="poster">
        </div>
        <div class="content">
            <div class="genre" id="genre">SİNEMA</div>
            <div class="title" id="title"></div>
            <div class="meta">
                <span id="rating">⭐ 0.0</span>
                <span id="year">📅 2026</span>
            </div>
            <div class="overview" id="overview"></div>
            <a href="#" target="_blank" class="btn-trailer" id="trailerBtn">▶ Fragmanı YouTube'da İzle</a>
        </div>
    </div>

    <script>
        const movies = [
            {
                title: "Inception (Başlangıç)",
                genre: "Bilim Kurgu • Aksiyon",
                rating: "8.8",
                year: "2010",
                poster: "https://upload.wikimedia.org/wikipedia/en/2/2e/Inception_%282010%29_theatrical_poster.jpg",
                overview: "Zihin hırsızlığı konusunda uzmanlaşmış Dom Cobb, bu kez bilinçaltına bir fikir yerleştirmek için imkansız görünen bir göreve soyunur."
            },
            {
                title: "Interstellar (Yıldızlararası)",
                genre: "Bilim Kurgu • Dram",
                rating: "8.7",
                year: "2014",
                poster: "https://upload.wikimedia.org/wikipedia/en/b/bc/Interstellar_film_poster.jpg",
                overview: "İnsanlığın yok olma tehlikesiyle karşı karşıya kaldığı bir gelecekte, astronotlar yaşanabilir yeni bir gezegen bulmak için solucan deliğinden geçer."
            },
            {
                title: "The Dark Knight (Kara Şövalye)",
                genre: "Aksiyon • Suç • Dram",
                rating: "9.0",
                year: "2008",
                poster: "https://upload.wikimedia.org/wikipedia/en/1/1c/The_Dark_Knight_%282008_film%29.jpg",
                overview: "Batman, Teğmen Gordon ve Savcı Harvey Dent ile Gotham'ı suçtan arındırmaya çalışırken kaotik suç dehası Joker ile yüzleşir."
            },
            {
                title: "Oppenheimer",
                genre: "Biyografi • Dram • Tarih",
                rating: "8.1",
                year: "2023",
                poster: "https://upload.wikimedia.org/wikipedia/en/4/4a/Oppenheimer_%28film%29.jpg",
                overview: "Amerikalı fizikçi J. Robert Oppenheimer'ın Manhattan Projesi kapsamında ilk atom bombasını geliştirme sürecindeki rolü ve sonrasındaki vicdani sorgulamaları."
            },
            {
                title: "La La Land (Aşıklar Şehri)",
                genre: "Komedi • Dram • Müzik",
                rating: "8.0",
                year: "2016",
                poster: "https://upload.wikimedia.org/wikipedia/en/a/ab/La_La_Land_%28film%29.jpg",
                overview: "Los Angeles'ta tutkulu bir caz piyanisti ile oyuncu olmaya çalışan genç bir kadının, hayallerini kovalarken yaşadıkları büyüleyici aşk hikayesi."
            },
            {
                title: "Parasite (Parazit)",
                genre: "Komedi • Dram • Gerilim",
                rating: "8.5",
                year: "2019",
                poster: "https://upload.wikimedia.org/wikipedia/en/5/53/Parasite_%282019_film%29.jpg",
                overview: "Sokak seviyesindeki bir bodrum katında yaşayan yoksul Kim ailesinin, zengin Park ailesinin hizmetine sinsice girmesiyle başlayan gerilim dolu toplumsal olaylar."
            },
            {
                title: "Whiplash",
                genre: "Dram • Müzik",
                rating: "8.5",
                year: "2014",
                poster: "https://upload.wikimedia.org/wikipedia/en/0/01/Whiplash_poster.jpg",
                overview: "Genç ve hırslı bir davulcu ile sınırları zorlayan acımasız bir orkestra şefinin arasındaki psikolojik ve müzikal mücadele."
            },
            {
                title: "Dune: Part Two (Dune 2)",
                genre: "Bilim Kurgu • Macera",
                rating: "8.5",
                year: "2024",
                poster: "https://upload.wikimedia.org/wikipedia/en/5/52/Dune_Part_Two_poster.jpeg",
                overview: "Paul Atreides'in ailesini yok eden komplo sahiplerine karşı başlattığı intikam savaşı ve Arrakis gezegeninin kaderini değiştirme çabası."
            },
            {
                title: "Fight Club (Dövüş Kulübü)",
                genre: "Dram",
                rating: "8.8",
                year: "1999",
                poster: "https://upload.wikimedia.org/wikipedia/en/fc/Fight_Club_poster.jpg",
                overview: "Uykusuzluk çeken bir büro çalışanının karizmatik sabun satıcısı Tyler Durden ile tanışıp yeraltı dövüş kulübü kurmasıyla başlayan modern hayat eleştirisi."
            },
            {
                title: "Pulp Fiction (Ucuz Roman)",
                genre: "Suç • Dram",
                rating: "8.9",
                year: "1994",
                poster: "https://upload.wikimedia.org/wikipedia/en/3/3b/Pulp_Fiction_%281994%29_poster.jpg",
                overview: "Los Angeles yeraltı dünyasından tetikçiler, bir boksör ve bir çete liderinin eşinin hayatlarının kesiştiği kült Quentin Tarantino yapımı."
            },
            {
                title: "Spirited Away (Ruhların Kaçışı)",
                genre: "Animasyon • Macera • Aile",
                rating: "8.5",
                year: "2001",
                poster: "https://upload.wikimedia.org/wikipedia/en/d/db/Spirited_Away_Japanese_poster.png",
                overview: "Ailesiyle yeni bir eve taşınırken gizemli bir dünyaya adım atan 10 yaşındaki Chihiro'nun, domuza dönüşen ailesini kurtarma mücadelesi."
            },
            {
                title: "The Prestige (Prestij)",
                genre: "Dram • Gizem • Sci-Fi",
                rating: "8.5",
                year: "2006",
                poster: "https://upload.wikimedia.org/wikipedia/en/d/d2/Prestige_poster.jpg",
                overview: "19. yüzyıl Londra'sında iki rakip sihirbazın en büyük illüzyonu yaratmak adına birbirlerinin hayatlarını yok etme pahasına girdikleri amansız rekabet."
            },
            {
                title: "Gladiator (Gladyatör)",
                genre: "Aksiyon • Macera • Dram",
                rating: "8.5",
                year: "2000",
                poster: "https://upload.wikimedia.org/wikipedia/en/f/fb/Gladiator_fam.jpg",
                overview: "İhanete uğrayarak ailesi katledilen ve köleleştirilen Romalı general Maximus'un, intikam almak için arenada bir gladyatör olarak yükselişi."
            },
            {
                title: "Joker",
                genre: "Suç • Dram • Gerilim",
                rating: "8.4",
                year: "2019",
                poster: "https://upload.wikimedia.org/wikipedia/en/e/e1/Joker_%282019_film%29_poster.jpg",
                overview: "Toplum tarafından dışlanan başarısız komedyen Arthur Fleck'in, yavaş yavaş akıl sağlığını yitirerek Gotham'da kaos simgesi Joker'e dönüşmesi."
            },
            {
                title: "The Truman Show",
                genre: "Komedi • Dram",
                rating: "8.2",
                year: "1998",
                poster: "https://upload.wikimedia.org/wikipedia/en/c/cd/Trumanshow.jpg",
                overview: "Hayatının doğduğu andan itibaren devasa bir televizyon stüdyosunda canlı yayınlandığından habersiz olan Truman'ın gerçeği keşfetme çabası."
            },
            {
                title: "Shutter Island (Zindan Adası)",
                genre: "Gizem • Gerilim",
                rating: "8.2",
                year: "2010",
                poster: "https://upload.wikimedia.org/wikipedia/en/7/76/Shutterislandposter.jpg",
                overview: "Tehlikeli akıl hastalarının tutulduğu bir adadaki hastaneden kaybolan bir kadını araştırmakla görevlendirilen iki polisin yaşadığı akıl oyunları."
            }
        ];

        let lastIndex = -1;

        function fetchRandomMovie() {
            const card = document.getElementById('movieCard');
            let randomIndex;
            
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (randomIndex === lastIndex && movies.length > 1);
            
            lastIndex = randomIndex;
            const movie = movies[randomIndex];

            document.getElementById('poster').src = movie.poster;
            document.getElementById('genre').innerText = movie.genre;
            document.getElementById('title').innerText = movie.title;
            document.getElementById('rating').innerText = `⭐ ${movie.rating}`;
            document.getElementById('year').innerText = `📅 ${movie.year}`;
            document.getElementById('overview').innerText = movie.overview;
            document.getElementById('trailerBtn').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + " fragman")}`;

            card.style.display = 'block';
        }
    </script>
</body>
</html>
