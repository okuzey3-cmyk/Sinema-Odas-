<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demet'in Sinema Odası</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .header { margin-top: 15px; margin-bottom: 20px; }
        .header h1 { color: #ff4d6d; font-size: 1.8rem; margin-bottom: 5px; }
        .header p { color: #a0a0a0; font-size: 0.9rem; }
        .card { background: #1e1e1e; border-radius: 16px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #2a2a2a; display: none; margin-bottom: 25px; margin-top: 15px; }
        .poster { width: 100%; height: 380px; object-fit: cover; background-color: #2a2a2a; display: block; }
        .content { padding: 20px; }
        .title { font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .genre { font-size: 0.8rem; color: #ff4d6d; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .meta { display: flex; justify-content: center; gap: 15px; margin-bottom: 12px; font-size: 0.9rem; color: #ffb703; }
        .overview { font-size: 0.9rem; color: #ccc; line-height: 1.4; margin-bottom: 20px; text-align: left; }
        .btn-trailer { display: inline-block; width: 100%; padding: 12px; background-color: #ff0000; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
        .btn-main { background: linear-gradient(135deg, #ff4d6d, #c9184a); color: white; border: none; padding: 16px 32px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4); transition: transform 0.2s; }
        .btn-main:active { transform: scale(0.98); }
        .loader { display: none; margin: 30px auto; border: 4px solid #333; border-top: 4px solid #ff4d6d; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 Demet'in Sinema Odası</h1>
        <p>Bugün ne izlesek diye düşünmeye son!</p>
    </div>

    <button class="btn-main" onclick="fetchRandomMovie()">🎲 Rastgele Film Getir</button>
    <div class="loader" id="loader"></div>

    <div class="card" id="movieCard">
        <img src="" alt="Poster" class="poster" id="poster">
        <div class="content">
            <div class="genre" id="genre">SİNEMA</div>
            <div class="title" id="title"></div>
            <div class="meta">
                <span id="rating">⭐ 0.0</span>
                <span id="year">📅 2026</span>
            </div>
            <div class="overview" id="overview"></div>
            <a href="#" target="_blank" class="btn-trailer" id="trailerBtn">▶ Fragmanı YouTube'da İzle</a>
        </div>
    </div>

    <script>
        const API_KEY = "8c88e992d9f7a77e8a34e00508ffb617";
        let shownIds = [];

        const genres = {
            28: "Aksiyon", 12: "Macera", 16: "Animasyon", 35: "Komedi", 80: "Suç",
            99: "Belgesel", 18: "Dram", 10751: "Aile", 14: "Fantastik", 36: "Tarih",
            27: "Korku", 10402: "Müzik", 9648: "Gizem", 10749: "Romantik",
            878: "Bilim Kurgu", 53: "Gerilim", 10752: "Savaş", 37: "Western"
        };

        async function fetchRandomMovie() {
            const card = document.getElementById('movieCard');
            const loader = document.getElementById('loader');
            card.style.display = 'none';
            loader.style.display = 'block';

            try {
                // Her seferinde popüler ilk 30 sayfadan rastgele veri çeker
                const randomPage = Math.floor(Math.random() * 30) + 1;
                const response = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=tr-TR&page=${randomPage}`);
                
                if (!response.ok) throw new Error("API hatası");

                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    // Yalnızca posteri ve açıklaması olanları al
                    const validMovies = data.results.filter(m => m.poster_path && m.overview && m.overview.length > 15 && !shownIds.includes(m.id));
                    
                    const selectedList = validMovies.length > 0 ? validMovies : data.results;
                    const movie = selectedList[Math.floor(Math.random() * selectedList.length)];
                    
                    shownIds.push(movie.id);
                    if (shownIds.length > 50) shownIds.shift(); // Hafızayı temiz tut

                    renderMovie(movie);
                } else {
                    throw new Error("Veri bulunamadı");
                }
            } catch (error) {
                // Hata oluşursa garantili 1. sayfadan rastgele film çeker, asla dönüp kalmaz
                fetchFallback();
            }
        }

        async function fetchFallback() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&language=tr-TR&page=1`);
                const data = await response.json();
                const movie = data.results[Math.floor(Math.random() * data.results.length)];
                renderMovie(movie);
            } catch (e) {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function renderMovie(movie) {
            const card = document.getElementById('movieCard');
            const loader = document.getElementById('loader');

            document.getElementById('poster').src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
            document.getElementById('title').innerText = movie.title;
            document.getElementById('rating').innerText = `⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : '8.0'}`;
            document.getElementById('year').innerText = `📅 ${movie.release_date ? movie.release_date.split('-')[0] : '2026'}`;
            document.getElementById('overview').innerText = movie.overview || "Açıklama mevcut değil.";

            if (movie.genre_ids && movie.genre_ids.length > 0) {
                const genreNames = movie.genre_ids.map(id => genres[id]).filter(Boolean);
                document.getElementById('genre').innerText = genreNames.join(' • ') || 'SİNEMA';
            } else {
                document.getElementById('genre').innerText = 'SİNEMA';
            }

            document.getElementById('trailerBtn').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + " fragman")}`;

            loader.style.display = 'none';
            card.style.display = 'block';
        }
    </script>
</body>
</html>
