<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Demet'in Sinema Odası</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sinema Odası">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#150A10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#150A10; --velvet:#24101A; --line:#3A1E29;
  --brass:#D9A441; --brass-deep:#8A6A2A;
  --rose:#E4586F; --paper:#F3EADC; --paper-2:#E7DACA;
  --ink-text:#2A1720; --ink-soft:#6B5460; --cream-soft:#B9A6AE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--ink); color:var(--paper); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom));
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% 0%,rgba(228,88,111,.10),transparent 60%),
             radial-gradient(100% 90% at 50% 100%,rgba(0,0,0,.55),transparent 60%)}
.wrap{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes print{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}
@keyframes flicker{0%,100%{opacity:.8}45%{opacity:.35}55%{opacity:1}}

.bulbs{width:100%;height:8px;margin-bottom:16px;opacity:.8;
  background:radial-gradient(circle at 4px 4px,var(--brass) 2px,transparent 2.5px) 0 0/18px 8px repeat-x;
  filter:drop-shadow(0 0 4px rgba(217,164,65,.45))}
.bulbs.on{animation:flicker .9s ease-in-out infinite}
.eyebrow{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.28em;color:var(--brass);margin-bottom:10px}
h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:clamp(1.7rem,7.5vw,2.1rem);line-height:1.15}
.tagline{font-size:.85rem;color:var(--cream-soft);margin-top:8px;margin-bottom:24px}

.filters{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.field{text-align:left;grid-column:span 2}
.field.half{grid-column:span 1}
.field.hide{display:none}
.field label{display:block;font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.18em;color:var(--brass-deep);margin-bottom:6px}
select{width:100%;padding:12px 38px 12px 13px;background:var(--velvet);color:var(--paper);
  border:1px solid var(--line);border-radius:4px;font-size:.88rem;font-family:inherit;outline:none;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg fill='%23D9A441' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
select:focus-visible{border-color:var(--brass)}

.draw{width:100%;margin-top:14px;padding:17px;background:var(--brass);color:#20110A;border:none;border-radius:4px;
  font-family:'Space Mono',monospace;font-weight:700;font-size:.95rem;letter-spacing:.16em;cursor:pointer;
  box-shadow:0 6px 20px rgba(217,164,65,.22);transition:transform .15s,opacity .2s}
.draw:active{transform:translateY(1px)}
.draw[disabled]{opacity:.5;cursor:default}

.strip{width:100%;margin-top:26px;display:none;grid-template-columns:repeat(3,1fr);gap:10px}
.strip.show{display:grid}
.pick{position:relative;cursor:pointer;border-radius:5px;overflow:hidden;background:var(--velvet);
  border:2px solid transparent;transition:border-color .25s,transform .2s;animation:rise .5s both}
.pick:active{transform:scale(.97)}
.pick.sel{border-color:var(--brass);box-shadow:0 0 16px rgba(217,164,65,.3)}
.pick img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.pick .tag{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;
  background:linear-gradient(transparent,rgba(21,10,16,.92));
  font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.06em;color:var(--paper)}
.strip-note{width:100%;margin-top:9px;font-family:'Space Mono',monospace;font-size:.58rem;
  letter-spacing:.14em;color:var(--brass-deep);display:none}
.strip-note.show{display:block}

.ticket{width:100%;margin-top:22px;background:var(--paper);border-radius:6px;color:var(--ink-text);
  box-shadow:0 18px 44px rgba(0,0,0,.55);display:none;position:relative;text-align:left}
.ticket.show{display:block}
.ticket.print{animation:print .5s cubic-bezier(.2,.7,.3,1) both}
.ticket.swap{animation:swap .3s ease-out both}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:6px 6px 0 0;background:var(--paper-2)}
.body{padding:20px 20px 16px}
.kinds{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--brass-deep);margin-bottom:9px}
.title{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:1.55rem;line-height:1.2;margin-bottom:10px}
.facts{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:14px}
.overview{font-size:.9rem;line-height:1.55;color:#43303A}

.sect{margin-top:18px;padding-top:15px;border-top:1px solid rgba(42,23,32,.14);display:none}
.sect.show{display:block}
.sect-label{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--brass-deep);margin-bottom:11px}
.cast{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cast::-webkit-scrollbar{display:none}
.who{flex:0 0 62px;text-align:center;animation:rise .4s both}
.who img{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;
  background:rgba(42,23,32,.12)}
.who b{display:block;font-size:.63rem;font-weight:600;line-height:1.25;color:var(--ink-text)}
.who span{display:block;font-size:.58rem;line-height:1.25;color:var(--ink-soft);margin-top:2px}
.logos{display:flex;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:7px;background:rgba(42,23,32,.06);border-radius:4px;padding:5px 9px 5px 5px;
  animation:rise .35s both}
.logo img{width:24px;height:24px;border-radius:4px;display:block}
.logo span{font-size:.73rem;color:#43303A}

.perf{position:relative;height:24px;
  background:radial-gradient(circle at 12px 12px,var(--ink) 4.5px,transparent 5px) 0 0/24px 24px repeat-x}
.perf::after{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:1px dashed rgba(42,23,32,.3)}
.notch{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.notch.l{left:-12px}.notch.r{right:-12px}

.stub{background:var(--paper-2);border-radius:0 0 6px 6px;padding:16px 20px 20px}
.stub-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.score{flex-shrink:0;width:52px;height:52px;border-radius:50%;border:2px solid var(--brass-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Mono',monospace}
.score b{font-size:.95rem;line-height:1;color:var(--ink-text)}
.score i{font-style:normal;font-size:.44rem;letter-spacing:.16em;color:var(--brass-deep);margin-top:3px}
.acts{display:flex;gap:8px;flex:1}
.act{flex:1;padding:11px 6px;background:transparent;border:1px solid rgba(42,23,32,.25);border-radius:4px;
  font-size:.76rem;font-weight:600;color:#43303A;cursor:pointer;font-family:inherit;transition:all .2s}
.act:active{transform:scale(.97)}
.act.on{background:var(--rose);border-color:var(--rose);color:#fff}
.act.on.seen{background:#3E7D6B;border-color:#3E7D6B}
.trailer{display:block;width:100%;padding:14px;background:var(--ink-text);color:var(--paper);text-align:center;
  text-decoration:none;border:none;border-radius:4px;font-family:'Space Mono',monospace;font-size:.78rem;
  letter-spacing:.14em;font-weight:700;cursor:pointer}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000;
  animation:swap .3s ease-out both}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.share{display:block;width:100%;margin-top:10px;padding:6px;background:none;border:none;cursor:pointer;
  font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.14em;color:var(--ink-soft)}

.bones{width:100%;margin-top:26px;display:none;grid-template-columns:repeat(3,1fr);gap:10px}
.bones.show{display:grid}
.bone{aspect-ratio:2/3;border-radius:5px;background:var(--velvet);border:1px solid var(--line);
  animation:pulse 1.3s ease-in-out infinite}
.bone:nth-child(2){animation-delay:.15s}
.bone:nth-child(3){animation-delay:.3s}

.shelf{width:100%;margin-top:42px;text-align:left}
.shelf h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:1.25rem;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:11px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--cream-soft);
  font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
.tab.active{border-color:var(--brass);color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.cell{position:relative;cursor:pointer;animation:rise .4s both}
.cell img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;display:block;background:var(--velvet)}
.cell p{font-size:.66rem;line-height:1.3;color:var(--cream-soft);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .x{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;background:rgba(21,10,16,.82);
  color:var(--paper);border:none;font-size:.85rem;line-height:1;cursor:pointer}
.blank{color:var(--ink-soft);font-size:.83rem;line-height:1.6;padding:16px 0}

.keep{display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.keep button{flex:1;padding:11px 6px;background:transparent;border:1px solid var(--line);border-radius:4px;
  color:var(--cream-soft);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.1em;cursor:pointer;
  transition:all .2s}
.keep button:active{transform:scale(.97)}
.keep-note{font-size:.72rem;color:var(--ink-soft);margin-top:9px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--velvet);border:1px solid var(--line);color:var(--paper);padding:12px 20px;border-radius:4px;
  font-size:.82rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:320px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bulbs" id="bulbs"></div>
  <div class="eyebrow" id="eyebrow">BUGÜN VİZYONDA</div>
  <h1>Demet'in Sinema Odası</h1>
  <p class="tagline">Üç bilet çek, akşamın filmi belli olsun.</p>

  <div class="filters">
    <div class="field">
      <label for="genreSelect">TÜR</label>
      <select id="genreSelect">
        <option value="">Fark etmez, sürpriz olsun</option>
        <option value="18">Dram</option>
        <option value="35">Komedi</option>
        <option value="10749">Romantik</option>
        <option value="53">Gerilim</option>
        <option value="27">Korku</option>
        <option value="80">Suç &amp; Polisiye</option>
        <option value="9648">Gizem</option>
        <option value="28">Aksiyon</option>
        <option value="12">Macera</option>
        <option value="878">Bilim Kurgu</option>
        <option value="14">Fantastik</option>
        <option value="16">Animasyon</option>
        <option value="10751">Aile</option>
        <option value="36">Tarih</option>
        <option value="10402">Müzik</option>
        <option value="99">Belgesel</option>
      </select>
    </div>

    <div class="field hide" id="platformField">
      <label for="platformSelect">PLATFORM</label>
      <select id="platformSelect"><option value="">Hepsi</option></select>
    </div>

    <div class="field half">
      <label for="runSelect">SÜRE</label>
      <select id="runSelect">
        <option value="">Fark etmez</option>
        <option value="short">90 dk'dan kısa</option>
        <option value="mid">90 – 120 dk</option>
        <option value="long">2 saatten uzun</option>
      </select>
    </div>

    <div class="field half">
      <label for="scoreSelect">PUAN</label>
      <select id="scoreSelect">
        <option value="">Fark etmez</option>
        <option value="6">6 ve üstü</option>
        <option value="7">7 ve üstü</option>
        <option value="8">8 ve üstü</option>
      </select>
    </div>
  </div>

  <button class="draw" id="drawBtn">🎟 ÜÇ BİLET ÇEK</button>

  <div class="bones" id="bones"><div class="bone"></div><div class="bone"></div><div class="bone"></div></div>

  <div class="strip" id="strip"></div>
  <div class="strip-note" id="stripNote">BİRİNE DOKUN, BİLETİ AÇILSIN</div>

  <div class="ticket" id="ticket">
    <img class="poster" id="poster" src="" alt="">
    <div class="body">
      <div class="kinds" id="kinds"></div>
      <div class="title" id="title"></div>
      <div class="facts" id="facts"></div>
      <div class="overview" id="overview"></div>
      <div class="sect" id="castSect">
        <div class="sect-label">OYUNCULAR</div>
        <div class="cast" id="cast"></div>
      </div>
      <div class="sect" id="where">
        <div class="sect-label">NEREDE İZLENİR</div>
        <div class="logos" id="logos"></div>
      </div>
    </div>
    <div class="perf"><span class="notch l"></span><span class="notch r"></span></div>
    <div class="stub">
      <div class="stub-top">
        <div class="score"><b id="score">—</b><i>PUAN</i></div>
        <div class="acts">
          <button class="act" id="favBtn">♡ Favori</button>
          <button class="act" id="seenBtn">İzledim</button>
        </div>
      </div>
      <div id="trailerBox"></div>
      <button class="share" id="shareBtn">BU FİLMİ PAYLAŞ</button>
    </div>
  </div>

  <div class="shelf">
    <h2>Demet'in Rafı</h2>
    <div class="tabs">
      <button class="tab active" id="tabFav">FAVORİLER</button>
      <button class="tab" id="tabSeen">İZLENENLER</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="blank" id="blank"></div>
    <div class="keep">
      <button id="saveBtn">↓ RAFI YEDEKLE</button>
      <button id="loadBtn">↑ YEDEĞİ YÜKLE</button>
    </div>
    <p class="keep-note">Raf sadece bu tarayıcıda saklanıyor. Arada bir yedek alıp telefonuna kaydetmen iyi olur.</p>
    <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* --- eski service worker / onbellek temizligi --- */
(function(){try{
  if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations()
    .then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
  if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){})}
}catch(e){}})();

var API_KEY="91a5fe677d52ce465948f464c3cfd53b";
var BASE="https://api.themoviedb.org/3";
var IMG="https://image.tmdb.org/t/p/";
var K_FAV="sinemaOdasi_favorites", K_SEEN="sinemaOdasi_watched", K_HIST="sinemaOdasi_history";

var GENRES={28:"Aksiyon",12:"Macera",16:"Animasyon",35:"Komedi",80:"Suç",18:"Dram",10751:"Aile",
14:"Fantastik",27:"Korku",10749:"Romantik",878:"Bilim Kurgu",53:"Gerilim",9648:"Gizem",
10752:"Savaş",37:"Western",36:"Tarih",10402:"Müzik",99:"Belgesel",10770:"TV Filmi"};

var WANTED=["Netflix","Amazon Prime Video","Disney Plus","BluTV","MUBI","Apple TV Plus",
"Exxen","Gain","TOD","puhutv","TV+","HBO Max","Max","beIN CONNECT"];

var loading=false, current=null, tab="fav", pages={}, dcache={}, picks=[], trailerKey=null;
var $=function(id){return document.getElementById(id)};

/* --- depolama --- */
function get(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function has(k,id){return get(k).some(function(m){return m.id===id})}
function slim(m){return{id:m.id,title:m.title,poster_path:m.poster_path,overview:m.overview,
  vote_average:m.vote_average,release_date:m.release_date,genre_ids:m.genre_ids||[]}}

/* --- ag --- */
function ask(path,params){
  var url=BASE+path+"?api_key="+API_KEY+"&language=tr-TR";
  for(var k in params){if(params[k]!==""&&params[k]!=null)url+="&"+k+"="+params[k]}
  var ctrl=("AbortController" in window)?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},12000);
  return fetch(url,ctrl?{signal:ctrl.signal}:undefined).then(function(r){
    clearTimeout(timer);
    if(!r.ok){var e=new Error("HTTP "+r.status);e.status=r.status;throw e}
    return r.json();
  },function(e){clearTimeout(timer);throw e});
}

function filters(){
  return{genre:$("genreSelect").value,platform:$("platformSelect").value,
    run:$("runSelect").value,score:$("scoreSelect").value};
}

function discover(f,page){
  var p={sort_by:"popularity.desc",include_adult:"false","vote_count.gte":150,
    with_genres:f.genre,page:page};
  if(f.platform){p.watch_region="TR";p.with_watch_providers=f.platform;p.with_watch_monetization_types="flatrate"}
  if(f.run==="short")p["with_runtime.lte"]=90;
  if(f.run==="mid"){p["with_runtime.gte"]=90;p["with_runtime.lte"]=120}
  if(f.run==="long")p["with_runtime.gte"]=120;
  if(f.score)p["vote_average.gte"]=f.score;
  return ask("/discover/movie",p);
}

function pageCount(f){
  var key=[f.genre,f.platform,f.run,f.score].join("|");
  if(pages[key])return Promise.resolve(pages[key]);
  return discover(f,1).then(function(d){
    pages[key]=Math.max(1,Math.min(d.total_pages||1,25));
    return pages[key];
  });
}

function loadPlatforms(){
  ask("/watch/providers/movie",{watch_region:"TR"}).then(function(d){
    var all=d.results||[], picked=[];
    WANTED.forEach(function(name){
      var hit=all.filter(function(p){return p.provider_name===name})[0];
      if(hit)picked.push(hit);
    });
    if(picked.length<2)return;
    var sel=$("platformSelect");
    picked.forEach(function(p){
      var o=document.createElement("option");
      o.value=p.provider_id; o.text=p.provider_name;
      sel.appendChild(o);
    });
    $("platformField").className="field";
  }).catch(function(){});
}

/* --- uc bilet --- */
function draw(){
  if(loading)return;
  var f=filters();
  setLoading(true);
  pageCount(f).then(function(tp){
    return discover(f,Math.floor(Math.random()*tp)+1);
  }).then(function(d){
    var seen=get(K_HIST);
    var pool=(d.results||[]).filter(function(m){
      return m.poster_path&&m.overview&&m.overview.length>20});
    var fresh=pool.filter(function(m){return seen.indexOf(m.id)===-1});
    if(fresh.length>=3)pool=fresh;
    if(!pool.length){var e=new Error("EMPTY");e.code="EMPTY";throw e}
    picks=shuffle(pool).slice(0,3);
    picks.forEach(function(m){remember(m.id)});
    renderStrip();
    open(picks[0],0,"print");
  }).catch(oops).then(function(){setLoading(false)});
}

function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}

function remember(id){
  var h=get(K_HIST); h.push(id);
  if(h.length>90)h=h.slice(-90);
  put(K_HIST,h);
}

function renderStrip(){
  var s=$("strip"); s.innerHTML="";
  picks.forEach(function(m,i){
    var el=document.createElement("div");
    el.className="pick"+(i===0?" sel":"");
    el.style.animationDelay=(i*90)+"ms";
    var img=document.createElement("img");
    img.src=m.poster_path?IMG+"w200"+m.poster_path:""; img.alt=m.title;
    var tag=document.createElement("div");
    tag.className="tag";
    tag.innerText=(m.vote_average?("★ "+m.vote_average.toFixed(1)):"★ —");
    el.appendChild(img); el.appendChild(tag);
    el.onclick=function(){open(m,i,"swap")};
    s.appendChild(el);
  });
  s.className="strip show";
  $("stripNote").className="strip-note show";
}

function mark(i){
  var kids=$("strip").children;
  for(var k=0;k<kids.length;k++)kids[k].className="pick"+(k===i?" sel":"");
}

/* --- bilet --- */
function open(m,i,mode){
  current=m; trailerKey=null;
  mark(i);
  $("poster").src=m.poster_path?IMG+"w500"+m.poster_path:"";
  $("poster").alt=m.title+" afişi";
  $("title").innerText=m.title;
  $("overview").innerText=m.overview||"Bu film için Türkçe özet bulunamadı.";
  $("score").innerText=m.vote_average?m.vote_average.toFixed(1):"—";
  var names=(m.genre_ids||[]).map(function(id){return GENRES[id]}).filter(Boolean);
  $("kinds").innerText=names.slice(0,3).join("  ·  ")||"SİNEMA";
  setFacts(m,null);
  $("castSect").className="sect"; $("cast").innerHTML="";
  $("where").className="sect"; $("logos").innerHTML="";
  renderTrailer();
  buttons();

  var t=$("ticket");
  t.className="ticket";
  void t.offsetWidth;
  t.className="ticket show "+(mode||"swap");

  details(m);
}

function details(m){
  if(dcache[m.id]){paint(m,dcache[m.id]);return}
  ask("/movie/"+m.id,{append_to_response:"credits,videos,watch/providers",include_video_language:"tr,en"})
    .then(function(d){dcache[m.id]=d;paint(m,d)}).catch(function(){});
}

function paint(m,d){
  if(!current||current.id!==m.id)return;
  if(d.runtime)setFacts(m,d.runtime);
  showCast(d.credits);
  showWhere(d["watch/providers"]);
  trailerKey=pickVideo(d.videos);
  renderTrailer();
}

function showCast(credits){
  var list=((credits&&credits.cast)||[]).slice(0,6);
  if(!list.length)return;
  var box=$("cast"); box.innerHTML="";
  list.forEach(function(p,i){
    var el=document.createElement("div");
    el.className="who"; el.style.animationDelay=(i*60)+"ms";
    var img=document.createElement("img");
    img.src=p.profile_path?IMG+"w185"+p.profile_path:
      "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='%23d8c9b6'/><circle cx='20' cy='16' r='7' fill='%23b09a83'/><ellipse cx='20' cy='34' rx='13' ry='9' fill='%23b09a83'/></svg>";
    img.alt=p.name; img.loading="lazy";
    var b=document.createElement("b"); b.innerText=p.name;
    var s=document.createElement("span"); s.innerText=p.character||"";
    el.appendChild(img); el.appendChild(b); el.appendChild(s);
    box.appendChild(el);
  });
  $("castSect").className="sect show";
}

function showWhere(wp){
  var tr=wp&&wp.results&&wp.results.TR;
  if(!tr)return;
  var all=[].concat(tr.flatrate||[],tr.free||[],tr.ads||[]);
  var seen={},uniq=[];
  all.forEach(function(p){if(!seen[p.provider_id]){seen[p.provider_id]=1;uniq.push(p)}});
  if(!uniq.length)return;
  var box=$("logos"); box.innerHTML="";
  uniq.slice(0,6).forEach(function(p,i){
    var el=document.createElement("div");
    el.className="logo"; el.style.animationDelay=(i*50)+"ms";
    el.innerHTML='<img src="'+IMG+'w92'+p.logo_path+'" alt=""><span></span>';
    el.querySelector("span").innerText=p.provider_name;
    box.appendChild(el);
  });
  $("where").className="sect show";
}

function pickVideo(v){
  var a=(v&&v.results)||[];
  var yt=a.filter(function(x){return x.site==="YouTube"});
  var p=yt.filter(function(x){return x.type==="Trailer"})[0]
       ||yt.filter(function(x){return x.type==="Teaser"})[0]||yt[0];
  return p?p.key:null;
}

function renderTrailer(){
  var box=$("trailerBox"); box.innerHTML="";
  if(trailerKey){
    var b=document.createElement("button");
    b.className="trailer"; b.innerText="▶ FRAGMANI İZLE";
    b.onclick=function(){
      var f=document.createElement("div");
      f.className="frame";
      f.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+trailerKey+
        '?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" '+
        'allowfullscreen title="Fragman"></iframe>';
      box.innerHTML=""; box.appendChild(f);
    };
    box.appendChild(b);
  }else{
    var a=document.createElement("a");
    a.className="trailer"; a.target="_blank"; a.rel="noopener";
    a.innerText="▶ FRAGMANI ARA";
    a.href=current?("https://www.youtube.com/results?search_query="+
      encodeURIComponent(current.title+" fragman")):"#";
    box.appendChild(a);
  }
}

function setFacts(m,runtime){
  var bits=[];
  if(m.release_date)bits.push(m.release_date.split("-")[0]);
  if(runtime){
    var h=Math.floor(runtime/60), d=runtime%60;
    bits.push(h?(h+" sa "+d+" dk"):(d+" dk"));
  }
  $("facts").innerText=bits.join("   ·   ");
}

function setLoading(on){
  loading=on;
  $("drawBtn").disabled=on;
  $("bulbs").className=on?"bulbs on":"bulbs";
  $("bones").className=on?"bones show":"bones";
  if(on){
    $("strip").className="strip";
    $("stripNote").className="strip-note";
    $("ticket").className="ticket";
  }
}

/* --- raf --- */
function buttons(){
  if(!current)return;
  var f=$("favBtn"), s=$("seenBtn");
  var isF=has(K_FAV,current.id), isS=has(K_SEEN,current.id);
  f.className="act"+(isF?" on":"");
  f.innerText=isF?"♥ Favorimde":"♡ Favori";
  s.className="act"+(isS?" on seen":"");
  s.innerText=isS?"✓ İzledim":"İzledim";
}

function toggle(key,label){
  if(!current)return;
  var list=get(key);
  var i=list.findIndex(function(m){return m.id===current.id});
  if(i>-1){list.splice(i,1);say(label+" listesinden çıkarıldı")}
  else{list.unshift(slim(current));say(label+" listesine eklendi")}
  put(key,list); buttons(); shelf();
}

function shelf(){
  var key=tab==="fav"?K_FAV:K_SEEN;
  var list=get(key), grid=$("grid"), blank=$("blank");
  grid.innerHTML="";
  if(!list.length){
    blank.style.display="block";
    blank.innerText=tab==="fav"
      ?"Raf henüz boş. Beğendiğin bir bilet çıkınca kalbe dokun, burada dursun."
      :"İzlediğin filmleri işaretledikçe burada birikecek.";
    return;
  }
  blank.style.display="none";
  list.forEach(function(m,i){
    var cell=document.createElement("div");
    cell.className="cell";
    cell.style.animationDelay=Math.min(i*40,400)+"ms";
    var img=document.createElement("img");
    img.src=m.poster_path?IMG+"w200"+m.poster_path:"";
    img.alt=m.title; img.loading="lazy";
    var cap=document.createElement("p"); cap.innerText=m.title;
    cell.onclick=function(){
      picks=[m]; renderStrip(); open(m,0,"swap");
      window.scrollTo({top:0,behavior:"smooth"});
    };
    var x=document.createElement("button");
    x.className="x"; x.innerText="×";
    x.onclick=function(e){
      e.stopPropagation();
      put(key,get(key).filter(function(o){return o.id!==m.id}));
      shelf(); buttons(); say("Raftan çıkarıldı");
    };
    cell.appendChild(img); cell.appendChild(x); cell.appendChild(cap);
    grid.appendChild(cell);
  });
}

function switchTab(t){
  tab=t;
  $("tabFav").className="tab"+(t==="fav"?" active":"");
  $("tabSeen").className="tab"+(t==="seen"?" active":"");
  shelf();
}

/* --- yedek --- */
function backup(){
  var data={app:"Demet'in Sinema Odası",v:1,tarih:new Date().toISOString(),
    favoriler:get(K_FAV),izlenenler:get(K_SEEN)};
  try{
    var blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="sinema-odasi-yedek.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    say("Yedek dosyası hazır");
  }catch(e){say("Yedek alınamadı")}
}

function restore(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      var f=merge(get(K_FAV),d.favoriler||[]);
      var s=merge(get(K_SEEN),d.izlenenler||[]);
      put(K_FAV,f); put(K_SEEN,s);
      shelf(); buttons();
      say("Yedek yüklendi: "+f.length+" favori, "+s.length+" izlenen");
    }catch(e){say("Dosya okunamadı, doğru yedek mi?")}
  };
  r.onerror=function(){say("Dosya açılamadı")};
  r.readAsText(file);
}

function merge(a,b){
  var seen={},out=[];
  a.concat(b).forEach(function(m){
    if(m&&m.id&&!seen[m.id]){seen[m.id]=1;out.push(m)}
  });
  return out;
}

/* --- paylas --- */
function share(){
  if(!current)return;
  var yil=current.release_date?(" ("+current.release_date.split("-")[0]+")"):"";
  var link=trailerKey?("\nFragman: https://www.youtube.com/watch?v="+trailerKey):"";
  var text="Bu akşam bunu izleyelim mi? "+current.title+yil+link;
  if(navigator.share){navigator.share({title:current.title,text:text}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(text)
    .then(function(){say("Kopyalandı, yapıştırman yeterli")}).catch(function(){say("Kopyalanamadı")})}
  else{say("Bu tarayıcı paylaşmayı desteklemiyor")}
}

/* --- hata & bildirim --- */
function oops(e){
  var msg="Bir aksilik oldu, tekrar dener misin?";
  if(e&&e.name==="AbortError")msg="Bağlantı ağır, tekrar dene.";
  else if(!navigator.onLine)msg="İnternet bağlantısı yok.";
  else if(e&&e.status===401)msg="API anahtarı geçersiz görünüyor.";
  else if(e&&e.status===429)msg="Biraz hızlı gittik, bir saniye bekle.";
  else if(e&&e.code==="EMPTY")msg="Bu seçimlerle film çıkmadı, filtreleri gevşet.";
  say(msg);
}

var tt;
function say(m){
  var t=$("toast"); t.innerText=m; t.className="toast show";
  clearTimeout(tt); tt=setTimeout(function(){t.className="toast"},2600);
}

/* --- selamlama --- */
(function(){
  var h=new Date().getHours();
  $("eyebrow").innerText=h<6?"GECE SEANSI":h<12?"GÜNAYDIN DEMET":h<18?"İYİ GÜNLER DEMET":"İYİ AKŞAMLAR DEMET";
})();

/* --- baglama --- */
$("drawBtn").onclick=draw;
$("favBtn").onclick=function(){toggle(K_FAV,"Favori")};
$("seenBtn").onclick=function(){toggle(K_SEEN,"İzlenenler")};
$("shareBtn").onclick=share;
$("tabFav").onclick=function(){switchTab("fav")};
$("tabSeen").onclick=function(){switchTab("seen")};
$("saveBtn").onclick=backup;
$("loadBtn").onclick=function(){$("fileInput").click()};
$("fileInput").onchange=function(e){
  var f=e.target.files&&e.target.files[0];
  if(f)restore(f);
  e.target.value="";
};

loadPlatforms();
shelf();
</script>
</body>
