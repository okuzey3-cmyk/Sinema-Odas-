<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Demet'in Sinema Odası</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sinema Odası">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#150A10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#150A10; --velvet:#24101A; --line:#3A1E29;
  --brass:#D9A441; --brass-deep:#8A6A2A;
  --rose:#E4586F; --paper:#F3EADC; --paper-2:#E7DACA;
  --ink-text:#2A1720; --ink-soft:#6B5460; --cream-soft:#B9A6AE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--ink); color:var(--paper); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom));
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% 0%,rgba(228,88,111,.10),transparent 60%),
             radial-gradient(100% 90% at 50% 100%,rgba(0,0,0,.55),transparent 60%)}
.wrap{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}

.bulbs{width:100%;height:8px;margin-bottom:16px;opacity:.8;
  background:radial-gradient(circle at 4px 4px,var(--brass) 2px,transparent 2.5px) 0 0/18px 8px repeat-x;
  filter:drop-shadow(0 0 4px rgba(217,164,65,.45))}
.eyebrow{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.28em;color:var(--brass);margin-bottom:10px}
h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:clamp(1.7rem,7.5vw,2.1rem);line-height:1.15;color:var(--paper)}
.tagline{font-size:.85rem;color:var(--cream-soft);margin-top:8px;margin-bottom:26px}

.field{width:100%;text-align:left;margin-bottom:12px}
.field.hide{display:none}
.field label{display:block;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.2em;color:var(--brass-deep);margin-bottom:7px}
select{width:100%;padding:13px 44px 13px 15px;background:var(--velvet);color:var(--paper);
  border:1px solid var(--line);border-radius:4px;font-size:.95rem;font-family:inherit;outline:none;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg fill='%23D9A441' height='22' viewBox='0 0 24 24' width='22' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
select:focus-visible{border-color:var(--brass)}

.draw{width:100%;margin-top:6px;padding:17px;background:var(--brass);color:#20110A;border:none;border-radius:4px;
  font-family:'Space Mono',monospace;font-weight:700;font-size:.95rem;letter-spacing:.16em;cursor:pointer;
  box-shadow:0 6px 20px rgba(217,164,65,.22);transition:transform .15s,opacity .15s}
.draw:active{transform:translateY(1px)}
.draw[disabled]{opacity:.5;cursor:default}

.ticket{width:100%;margin-top:30px;background:var(--paper);border-radius:6px;color:var(--ink-text);
  box-shadow:0 18px 44px rgba(0,0,0,.55);display:none;position:relative;text-align:left}
.ticket.show{display:block;animation:print .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes print{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:6px 6px 0 0;background:var(--paper-2)}
.body{padding:20px 20px 16px}
.kinds{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--brass-deep);margin-bottom:9px}
.title{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:1.55rem;line-height:1.2;margin-bottom:10px}
.facts{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:14px}
.overview{font-size:.9rem;line-height:1.55;color:#43303A}
.where{margin-top:18px;padding-top:15px;border-top:1px solid rgba(42,23,32,.14);display:none}
.where-label{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--brass-deep);margin-bottom:10px}
.logos{display:flex;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:7px;background:rgba(42,23,32,.06);border-radius:4px;padding:5px 9px 5px 5px}
.logo img{width:24px;height:24px;border-radius:4px;display:block}
.logo span{font-size:.73rem;color:#43303A}

.perf{position:relative;height:24px;
  background:radial-gradient(circle at 12px 12px,var(--ink) 4.5px,transparent 5px) 0 0/24px 24px repeat-x}
.perf::after{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:1px dashed rgba(42,23,32,.3)}
.notch{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.notch.l{left:-12px}.notch.r{right:-12px}

.stub{background:var(--paper-2);border-radius:0 0 6px 6px;padding:16px 20px 20px}
.stub-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.score{flex-shrink:0;width:52px;height:52px;border-radius:50%;border:2px solid var(--brass-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Mono',monospace}
.score b{font-size:.95rem;line-height:1;color:var(--ink-text)}
.score i{font-style:normal;font-size:.44rem;letter-spacing:.16em;color:var(--brass-deep);margin-top:3px}
.acts{display:flex;gap:8px;flex:1}
.act{flex:1;padding:11px 6px;background:transparent;border:1px solid rgba(42,23,32,.25);border-radius:4px;
  font-size:.76rem;font-weight:600;color:#43303A;cursor:pointer;font-family:inherit;transition:all .15s}
.act:active{transform:scale(.97)}
.act.on{background:var(--rose);border-color:var(--rose);color:#fff}
.act.on.seen{background:#3E7D6B;border-color:#3E7D6B}

.trailer{display:block;width:100%;padding:14px;background:var(--ink-text);color:var(--paper);text-align:center;
  text-decoration:none;border:none;border-radius:4px;font-family:'Space Mono',monospace;font-size:.78rem;
  letter-spacing:.14em;font-weight:700;cursor:pointer}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.share{display:block;width:100%;margin-top:10px;padding:6px;background:none;border:none;cursor:pointer;
  font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.14em;color:var(--ink-soft)}

.skeleton{width:100%;margin-top:30px;background:var(--velvet);border:1px solid var(--line);border-radius:6px;
  aspect-ratio:2/2.9;display:none;animation:pulse 1.4s ease-in-out infinite}
.skeleton.show{display:block}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.8}}

.shelf{width:100%;margin-top:40px;text-align:left}
.shelf h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:1.25rem;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:11px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--cream-soft);
  font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;cursor:pointer}
.tab.active{border-color:var(--brass);color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.cell{position:relative;cursor:pointer}
.cell img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;display:block;background:var(--velvet)}
.cell p{font-size:.66rem;line-height:1.3;color:var(--cream-soft);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .x{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;background:rgba(21,10,16,.82);
  color:var(--paper);border:none;font-size:.85rem;line-height:1;cursor:pointer}
.blank{color:var(--ink-soft);font-size:.83rem;line-height:1.6;padding:16px 0}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--velvet);border:1px solid var(--line);color:var(--paper);padding:12px 20px;border-radius:4px;
  font-size:.82rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:320px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bulbs"></div>
  <div class="eyebrow">BUGÜN VİZYONDA</div>
  <h1>Demet'in Sinema Odası</h1>
  <p class="tagline">Bilet çek, akşamın filmi belli olsun.</p>

  <div class="field">
    <label for="genreSelect">TÜR</label>
    <select id="genreSelect">
      <option value="">Fark etmez, sürpriz olsun</option>
      <option value="18">Dram</option>
      <option value="35">Komedi</option>
      <option value="10749">Romantik</option>
      <option value="53">Gerilim</option>
      <option value="27">Korku</option>
      <option value="80">Suç &amp; Polisiye</option>
      <option value="9648">Gizem</option>
      <option value="28">Aksiyon</option>
      <option value="12">Macera</option>
      <option value="878">Bilim Kurgu</option>
      <option value="14">Fantastik</option>
      <option value="16">Animasyon</option>
      <option value="10751">Aile</option>
      <option value="36">Tarih</option>
      <option value="10402">Müzik</option>
      <option value="99">Belgesel</option>
    </select>
  </div>

  <div class="field hide" id="platformField">
    <label for="platformSelect">PLATFORM</label>
    <select id="platformSelect">
      <option value="">Hepsi</option>
    </select>
  </div>

  <button class="draw" id="drawBtn">🎟 BİLET ÇEK</button>

  <div class="skeleton" id="skeleton"></div>

  <div class="ticket" id="ticket">
    <img class="poster" id="poster" src="" alt="">
    <div class="body">
      <div class="kinds" id="kinds"></div>
      <div class="title" id="title"></div>
      <div class="facts" id="facts"></div>
      <div class="overview" id="overview"></div>
      <div class="where" id="where">
        <div class="where-label">NEREDE İZLENİR</div>
        <div class="logos" id="logos"></div>
      </div>
    </div>
    <div class="perf"><span class="notch l"></span><span class="notch r"></span></div>
    <div class="stub">
      <div class="stub-top">
        <div class="score"><b id="score">—</b><i>PUAN</i></div>
        <div class="acts">
          <button class="act" id="favBtn">♡ Favori</button>
          <button class="act" id="seenBtn">İzledim</button>
        </div>
      </div>
      <div id="trailerBox"></div>
      <button class="share" id="shareBtn">BU FİLMİ PAYLAŞ</button>
    </div>
  </div>

  <div class="shelf">
    <h2>Demet'in Rafı</h2>
    <div class="tabs">
      <button class="tab active" id="tabFav">FAVORİLER</button>
      <button class="tab" id="tabSeen">İZLENENLER</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="blank" id="blank"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* --- eski service worker / onbellek temizligi --- */
(function(){try{
  if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations()
    .then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
  if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){})}
}catch(e){}})();

var API_KEY="91a5fe677d52ce465948f464c3cfd53b";
var BASE="https://api.themoviedb.org/3";
var IMG="https://image.tmdb.org/t/p/";
var K_FAV="sinemaOdasi_favorites", K_SEEN="sinemaOdasi_watched", K_HIST="sinemaOdasi_history";

var GENRES={28:"Aksiyon",12:"Macera",16:"Animasyon",35:"Komedi",80:"Suç",18:"Dram",10751:"Aile",
14:"Fantastik",27:"Korku",10749:"Romantik",878:"Bilim Kurgu",53:"Gerilim",9648:"Gizem",
10752:"Savaş",37:"Western",36:"Tarih",10402:"Müzik",99:"Belgesel",10770:"TV Filmi"};

/* abonelikle izlenen servisler - TMDb'nin canli listesinden bu isimler eslenir */
var WANTED=["Netflix","Amazon Prime Video","Disney Plus","BluTV","MUBI","Apple TV Plus",
"Exxen","Gain","TOD","puhutv","TV+","HBO Max","Max","beIN CONNECT"];

var loading=false, current=null, tab="fav", pages={}, trailerKey=null;
var $=function(id){return document.getElementById(id)};

/* --- depolama --- */
function get(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function has(k,id){return get(k).some(function(m){return m.id===id})}
function slim(m){return{id:m.id,title:m.title,poster_path:m.poster_path,overview:m.overview,
  vote_average:m.vote_average,release_date:m.release_date,genre_ids:m.genre_ids||[]}}

/* --- ag --- */
function ask(path,params){
  var url=BASE+path+"?api_key="+API_KEY+"&language=tr-TR";
  for(var k in params){if(params[k]!==""&&params[k]!=null)url+="&"+k+"="+params[k]}
  var ctrl=("AbortController" in window)?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},12000);
  return fetch(url,ctrl?{signal:ctrl.signal}:undefined).then(function(r){
    clearTimeout(timer);
    if(!r.ok){var e=new Error("HTTP "+r.status);e.status=r.status;throw e}
    return r.json();
  },function(e){clearTimeout(timer);throw e});
}

function discover(genre,platform,page){
  var p={sort_by:"popularity.desc",include_adult:"false","vote_count.gte":150,
    with_genres:genre,page:page};
  if(platform){p.watch_region="TR";p.with_watch_providers=platform;p.with_watch_monetization_types="flatrate"}
  return ask("/discover/movie",p);
}

function pageCount(genre,platform){
  var key=(genre||"all")+"|"+(platform||"all");
  if(pages[key])return Promise.resolve(pages[key]);
  return discover(genre,platform,1).then(function(d){
    pages[key]=Math.max(1,Math.min(d.total_pages||1,25));
    return pages[key];
  });
}

/* --- platform listesini TMDb'den kur --- */
function loadPlatforms(){
  ask("/watch/providers/movie",{watch_region:"TR"}).then(function(d){
    var all=d.results||[];
    var picked=[];
    WANTED.forEach(function(name){
      var hit=all.filter(function(p){return p.provider_name===name})[0];
      if(hit)picked.push(hit);
    });
    if(picked.length<2)return;
    var sel=$("platformSelect");
    picked.forEach(function(p){
      var o=document.createElement("option");
      o.value=p.provider_id; o.text=p.provider_name;
      sel.appendChild(o);
    });
    $("platformField").className="field";
  }).catch(function(){});
}

/* --- ana akis --- */
function draw(){
  if(loading)return;
  var genre=$("genreSelect").value;
  var platform=$("platformSelect").value;
  setLoading(true);
  pageCount(genre,platform).then(function(tp){
    return discover(genre,platform,Math.floor(Math.random()*tp)+1);
  }).then(function(d){
    var seen=get(K_HIST);
    var ok=(d.results||[]).filter(function(m){
      return m.poster_path&&m.overview&&m.overview.length>20&&seen.indexOf(m.id)===-1});
    if(!ok.length)ok=(d.results||[]).filter(function(m){return m.poster_path});
    if(!ok.length){var e=new Error("EMPTY");e.code="EMPTY";throw e}
    var movie=ok[Math.floor(Math.random()*ok.length)];
    remember(movie.id);
    show(movie);
    return details(movie);
  }).catch(oops).then(function(){setLoading(false)});
}

function remember(id){
  var h=get(K_HIST); h.push(id);
  if(h.length>80)h=h.slice(-80);
  put(K_HIST,h);
}

function details(movie){
  return ask("/movie/"+movie.id,{append_to_response:"watch/providers,videos",include_video_language:"tr,en"})
    .then(function(d){
      if(!current||current.id!==movie.id)return;
      if(d.runtime)setFacts(movie,d.runtime);
      showWhere(d["watch/providers"]);
      trailerKey=pickVideo(d.videos);
      renderTrailer();
    }).catch(function(){});
}

function pickVideo(v){
  var a=(v&&v.results)||[];
  var yt=a.filter(function(x){return x.site==="YouTube"});
  var p=yt.filter(function(x){return x.type==="Trailer"})[0]
       ||yt.filter(function(x){return x.type==="Teaser"})[0]||yt[0];
  return p?p.key:null;
}

/* --- gorunum --- */
function setLoading(on){
  loading=on;
  $("drawBtn").disabled=on;
  $("skeleton").className=on?"skeleton show":"skeleton";
  if(on)$("ticket").className="ticket";
}

function show(m){
  current=m; trailerKey=null;
  $("poster").src=m.poster_path?IMG+"w500"+m.poster_path:"";
  $("poster").alt=m.title+" afişi";
  $("title").innerText=m.title;
  $("overview").innerText=m.overview||"Bu film için Türkçe özet bulunamadı.";
  $("score").innerText=m.vote_average?m.vote_average.toFixed(1):"—";
  var names=(m.genre_ids||[]).map(function(id){return GENRES[id]}).filter(Boolean);
  $("kinds").innerText=names.slice(0,3).join("  ·  ")||"SİNEMA";
  setFacts(m,null);
  $("where").style.display="none";
  $("logos").innerHTML="";
  renderTrailer();
  buttons();
  $("skeleton").className="skeleton";
  $("ticket").className="ticket show";
}

function renderTrailer(){
  var box=$("trailerBox");
  box.innerHTML="";
  if(trailerKey){
    var b=document.createElement("button");
    b.className="trailer"; b.innerText="▶ FRAGMANI İZLE";
    b.onclick=function(){
      var f=document.createElement("div");
      f.className="frame";
      f.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+trailerKey+
        '?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" '+
        'allowfullscreen title="Fragman"></iframe>';
      box.innerHTML=""; box.appendChild(f);
    };
    box.appendChild(b);
  }else{
    var a=document.createElement("a");
    a.className="trailer"; a.target="_blank"; a.rel="noopener";
    a.innerText="▶ FRAGMANI ARA";
    a.href=current?("https://www.youtube.com/results?search_query="+
      encodeURIComponent(current.title+" fragman")):"#";
    box.appendChild(a);
  }
}

function setFacts(m,runtime){
  var bits=[];
  if(m.release_date)bits.push(m.release_date.split("-")[0]);
  if(runtime){
    var h=Math.floor(runtime/60), d=runtime%60;
    bits.push(h?(h+" sa "+d+" dk"):(d+" dk"));
  }
  $("facts").innerText=bits.join("   ·   ");
}

function showWhere(wp){
  var tr=wp&&wp.results&&wp.results.TR;
  if(!tr)return;
  var all=[].concat(tr.flatrate||[],tr.free||[],tr.ads||[]);
  var seen={},uniq=[];
  all.forEach(function(p){if(!seen[p.provider_id]){seen[p.provider_id]=1;uniq.push(p)}});
  if(!uniq.length)return;
  var box=$("logos"); box.innerHTML="";
  uniq.slice(0,6).forEach(function(p){
    var el=document.createElement("div");
    el.className="logo";
    el.innerHTML='<img src="'+IMG+'w92'+p.logo_path+'" alt=""><span></span>';
    el.querySelector("span").innerText=p.provider_name;
    box.appendChild(el);
  });
  $("where").style.display="block";
}

function buttons(){
  if(!current)return;
  var f=$("favBtn"), s=$("seenBtn");
  var isF=has(K_FAV,current.id), isS=has(K_SEEN,current.id);
  f.className="act"+(isF?" on":"");
  f.innerText=isF?"♥ Favorimde":"♡ Favori";
  s.className="act"+(isS?" on seen":"");
  s.innerText=isS?"✓ İzledim":"İzledim";
}

function toggle(key,label){
  if(!current)return;
  var list=get(key);
  var i=list.findIndex(function(m){return m.id===current.id});
  if(i>-1){list.splice(i,1);say(label+" listesinden çıkarıldı")}
  else{list.unshift(slim(current));say(label+" listesine eklendi")}
  put(key,list); buttons(); shelf();
}

/* --- paylas --- */
function share(){
  if(!current)return;
  var yil=current.release_date?(" ("+current.release_date.split("-")[0]+")"):"";
  var link=trailerKey?("\nFragman: https://www.youtube.com/watch?v="+trailerKey):"";
  var text="Bu akşam bunu izleyelim mi? "+current.title+yil+link;
  if(navigator.share){
    navigator.share({title:current.title,text:text}).catch(function(){});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){say("Kopyalandı, yapıştırman yeterli")})
      .catch(function(){say("Kopyalanamadı")});
  }else{say("Bu tarayıcı paylaşmayı desteklemiyor")}
}

/* --- raf --- */
function shelf(){
  var key=tab==="fav"?K_FAV:K_SEEN;
  var list=get(key), grid=$("grid"), blank=$("blank");
  grid.innerHTML="";
  if(!list.length){
    blank.style.display="block";
    blank.innerText=tab==="fav"
      ?"Raf henüz boş. Beğendiğin bir bilet çıkınca kalbe dokun, burada dursun."
      :"İzlediğin filmleri işaretledikçe burada birikecek.";
    return;
  }
  blank.style.display="none";
  list.forEach(function(m){
    var cell=document.createElement("div");
    cell.className="cell";
    var img=document.createElement("img");
    img.src=m.poster_path?IMG+"w200"+m.poster_path:"";
    img.alt=m.title; img.loading="lazy";
    var cap=document.createElement("p");
    cap.innerText=m.title;
    cell.onclick=function(){show(m);details(m);window.scrollTo({top:0,behavior:"smooth"})};
    var x=document.createElement("button");
    x.className="x"; x.innerText="×";
    x.onclick=function(e){
      e.stopPropagation();
      put(key,get(key).filter(function(o){return o.id!==m.id}));
      shelf(); buttons(); say("Raftan çıkarıldı");
    };
    cell.appendChild(img); cell.appendChild(x); cell.appendChild(cap);
    grid.appendChild(cell);
  });
}

function switchTab(t){
  tab=t;
  $("tabFav").className="tab"+(t==="fav"?" active":"");
  $("tabSeen").className="tab"+(t==="seen"?" active":"");
  shelf();
}

/* --- hata & bildirim --- */
function oops(e){
  var msg="Bir aksilik oldu, tekrar dener misin?";
  if(e&&e.name==="AbortError")msg="Bağlantı ağır, tekrar dene.";
  else if(!navigator.onLine)msg="İnternet bağlantısı yok.";
  else if(e&&e.status===401)msg="API anahtarı geçersiz görünüyor.";
  else if(e&&e.status===429)msg="Biraz hızlı gittik, bir saniye bekle.";
  else if(e&&e.code==="EMPTY")msg="Bu seçimlerle film çıkmadı, filtreleri gevşet.";
  say(msg);
}

var tt;
function say(m){
  var t=$("toast"); t.innerText=m; t.className="toast show";
  clearTimeout(tt); tt=setTimeout(function(){t.className="toast"},2400);
}

/* --- baglama --- */
$("drawBtn").onclick=draw;
$("favBtn").onclick=function(){toggle(K_FAV,"Favori")};
$("seenBtn").onclick=function(){toggle(K_SEEN,"İzlenenler")};
$("shareBtn").onclick=share;
$("tabFav").onclick=function(){switchTab("fav")};
$("tabSeen").onclick=function(){switchTab("seen")};
loadPlatforms();
shelf();
</script>
