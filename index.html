<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Demet'in Sinema Odası</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sinema Odası">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#150A10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#150A10; --velvet:#24101A; --line:#3A1E29;
  --brass:#D9A441; --brass-deep:#8A6A2A;
  --rose:#E4586F; --paper:#F3EADC; --paper-2:#E7DACA;
  --ink-text:#2A1720; --ink-soft:#6B5460; --cream-soft:#B9A6AE;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--ink); color:var(--paper); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom));
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% 0%,rgba(228,88,111,.10),transparent 60%),
             radial-gradient(100% 90% at 50% 100%,rgba(0,0,0,.55),transparent 60%)}
.wrap{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes print{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}
@keyframes flicker{0%,100%{opacity:.8}45%{opacity:.35}55%{opacity:1}}
@keyframes lightsUp{from{opacity:0}to{opacity:.8}}
@keyframes seal{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

/* --- perde --- */
.curtain{position:fixed;top:0;bottom:0;width:52vw;z-index:90;pointer-events:none;
  transition:transform .45s cubic-bezier(.45,0,.2,1)}
.curtain span{position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,#4A0E1D 0 14px,#6B1226 14px 30px,#3B0A18 30px 44px)}
.curtain.l{left:0;transform:translateX(-101%);box-shadow:inset -30px 0 50px rgba(0,0,0,.55)}
.curtain.r{right:0;transform:translateX(101%);box-shadow:inset 30px 0 50px rgba(0,0,0,.55)}
.curtain.shut{transform:translateX(0)}

/* --- isiklar --- */
.dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
  transition:opacity .6s;z-index:10}
.dimmer.on{opacity:.88;pointer-events:auto}
.wrap>*{transition:opacity .55s}
body.dark .wrap>*{opacity:.10}
body.dark .wrap>.ticket{opacity:1;z-index:20}
.lights{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;display:none;
  padding:11px 20px;background:var(--velvet);border:1px solid var(--brass-deep);border-radius:30px;
  color:var(--brass);font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.14em;cursor:pointer}
body.dark .lights{display:block}

.eyebrow,h1,.tagline,.filters,.draws,.shelf{animation:rise .6s cubic-bezier(.2,.7,.3,1) backwards}
.eyebrow{animation-delay:.10s}
h1{animation-delay:.18s}
.tagline{animation-delay:.26s}
.filters{animation-delay:.34s}
.draws{animation-delay:.42s}
.shelf{animation-delay:.52s}

.bulbs{width:100%;height:8px;margin-bottom:16px;opacity:.8;animation:lightsUp .8s backwards;
  background:radial-gradient(circle at 4px 4px,var(--brass) 2px,transparent 2.5px) 0 0/18px 8px repeat-x;
  filter:drop-shadow(0 0 4px rgba(217,164,65,.45));transition:opacity .6s}
.bulbs.on{animation:flicker .9s ease-in-out infinite}
body.dark .bulbs{opacity:.12}
.eyebrow{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.28em;color:var(--brass);margin-bottom:10px}
h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:clamp(1.7rem,7.5vw,2.1rem);line-height:1.15}
.tagline{font-size:.85rem;color:var(--cream-soft);margin-top:8px;margin-bottom:24px}

.filters{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.field{text-align:left;grid-column:span 2}
.field.half{grid-column:span 1}
.field.hide{display:none}
.field label{display:block;font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.18em;color:var(--brass-deep);margin-bottom:6px}
select{width:100%;padding:12px 38px 12px 13px;background:var(--velvet);color:var(--paper);
  border:1px solid var(--line);border-radius:4px;font-size:.88rem;font-family:inherit;outline:none;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg fill='%23D9A441' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
select:focus-visible{border-color:var(--brass)}

.draws{width:100%;margin-top:14px;display:flex;flex-direction:column;gap:9px}
.draw{width:100%;padding:17px;background:var(--brass);color:#20110A;border:none;border-radius:4px;
  font-family:'Space Mono',monospace;font-weight:700;font-size:.95rem;letter-spacing:.16em;cursor:pointer;
  box-shadow:0 6px 20px rgba(217,164,65,.22);transition:transform .15s,opacity .2s}
.draw:active{transform:translateY(1px)}
.draw[disabled]{opacity:.5;cursor:default}
.draw.ghost{background:transparent;color:var(--brass);border:1px solid var(--brass-deep);
  box-shadow:none;padding:14px;font-size:.78rem}

/* --- surpriz zarf --- */
.envelope{width:100%;margin-top:26px;display:none;background:var(--velvet);border:1px solid var(--brass-deep);
  border-radius:6px;padding:30px 24px 24px;text-align:center;position:relative;overflow:hidden}
.envelope.show{display:block;animation:print .5s cubic-bezier(.2,.7,.3,1) backwards}
.envelope::before{content:"";position:absolute;top:-42%;left:50%;width:150%;height:80%;transform:translateX(-50%) rotate(0deg);
  background:linear-gradient(180deg,rgba(217,164,65,.12),transparent);pointer-events:none}
.wax{width:56px;height:56px;border-radius:50%;background:var(--rose);margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  box-shadow:0 4px 14px rgba(228,88,111,.35);animation:seal 2.6s ease-in-out infinite}
.env-label{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.24em;color:var(--brass);margin-bottom:14px}
.env-meta{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:var(--cream-soft);margin-bottom:16px}
.env-clue{font-family:'Bodoni Moda',Georgia,serif;font-size:1.15rem;line-height:1.5;color:var(--paper);
  margin-bottom:24px;font-style:italic}
.env-open{width:100%;padding:15px;background:var(--brass);color:#20110A;border:none;border-radius:4px;
  font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;letter-spacing:.16em;cursor:pointer}
.env-open:active{transform:translateY(1px)}
.env-skip{display:block;width:100%;margin-top:12px;padding:6px;background:none;border:none;cursor:pointer;
  font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.12em;color:var(--ink-soft)}

.strip{width:100%;margin-top:26px;display:none;grid-template-columns:repeat(3,1fr);gap:10px}
.strip.show{display:grid}
.pick{position:relative;cursor:pointer;border-radius:5px;overflow:hidden;background:var(--velvet);
  border:2px solid transparent;transition:border-color .25s,transform .2s;animation:rise .5s backwards}
.pick:active{transform:scale(.97)}
.pick.sel{border-color:var(--brass);box-shadow:0 0 16px rgba(217,164,65,.3)}
.pick img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.pick .tag{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;
  background:linear-gradient(transparent,rgba(21,10,16,.92));
  font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.06em;color:var(--paper)}
.strip-note{width:100%;margin-top:9px;font-family:'Space Mono',monospace;font-size:.58rem;
  letter-spacing:.14em;color:var(--brass-deep);display:none}
.strip-note.show{display:block}

.ticket{--accent:#8A6A2A;
  width:100%;margin-top:22px;background:var(--paper);border-radius:6px;color:var(--ink-text);
  box-shadow:0 18px 44px rgba(0,0,0,.55);display:none;position:relative;text-align:left}
.ticket.show{display:block}
.ticket.print{animation:print .5s cubic-bezier(.2,.7,.3,1) backwards}
.ticket.swap{animation:swap .3s ease-out backwards}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:6px 6px 0 0;background:var(--paper-2)}
.body{padding:20px 20px 16px}
.kinds{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--accent);margin-bottom:9px}
.title{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:1.55rem;line-height:1.2;margin-bottom:10px}
.facts{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:14px}
.overview{font-size:.9rem;line-height:1.55;color:#43303A}

.sect{margin-top:18px;padding-top:15px;border-top:1px solid rgba(42,23,32,.14);display:none}
.sect.show{display:block}
.sect-label{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--accent);margin-bottom:11px}
.cast{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cast::-webkit-scrollbar{display:none}
.who{flex:0 0 62px;text-align:center;animation:rise .4s backwards}
.who img{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;
  background:rgba(42,23,32,.12)}
.who b{display:block;font-size:.63rem;font-weight:600;line-height:1.25;color:var(--ink-text)}
.who span{display:block;font-size:.58rem;line-height:1.25;color:var(--ink-soft);margin-top:2px}
.logos{display:flex;flex-wrap:wrap;gap:8px}
.logo{display:flex;align-items:center;gap:7px;background:rgba(42,23,32,.06);border-radius:4px;padding:5px 9px 5px 5px;
  animation:rise .35s backwards}
.logo img{width:24px;height:24px;border-radius:4px;display:block}
.logo span{font-size:.73rem;color:#43303A}

.perf{position:relative;height:24px;
  background:radial-gradient(circle at 12px 12px,var(--ink) 4.5px,transparent 5px) 0 0/24px 24px repeat-x}
.perf::after{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:1px dashed rgba(42,23,32,.3)}
.notch{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.notch.l{left:-12px}.notch.r{right:-12px}

.stub{background:var(--paper-2);border-radius:0 0 6px 6px;padding:16px 20px 20px}
.stub-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.score{flex-shrink:0;width:52px;height:52px;border-radius:50%;border:2px solid var(--accent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Mono',monospace}
.score b{font-size:.95rem;line-height:1;color:var(--ink-text)}
.score i{font-style:normal;font-size:.44rem;letter-spacing:.16em;color:var(--accent);margin-top:3px}
.acts{display:flex;gap:8px;flex:1}
.act{flex:1;padding:11px 6px;background:transparent;border:1px solid rgba(42,23,32,.25);border-radius:4px;
  font-size:.76rem;font-weight:600;color:#43303A;cursor:pointer;font-family:inherit;transition:all .2s}
.act:active{transform:scale(.97)}
.act.on{background:var(--rose);border-color:var(--rose);color:#fff}
.act.on.seen{background:#3E7D6B;border-color:#3E7D6B}
.trailer{display:block;width:100%;padding:14px;background:var(--ink-text);color:var(--paper);text-align:center;
  text-decoration:none;border:none;border-radius:4px;font-family:'Space Mono',monospace;font-size:.78rem;
  letter-spacing:.14em;font-weight:700;cursor:pointer}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000;
  animation:swap .3s ease-out backwards}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.extras{display:flex;gap:8px;margin-top:10px}
.extras button{flex:1;padding:11px 6px;background:transparent;border:1px solid rgba(42,23,32,.22);border-radius:4px;
  font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.1em;color:var(--ink-soft);cursor:pointer;
  transition:all .2s}
.extras button:active{transform:scale(.97)}

.bones{width:100%;margin-top:26px;display:none;grid-template-columns:repeat(3,1fr);gap:10px}
.bones.show{display:grid}
.bone{aspect-ratio:2/3;border-radius:5px;background:var(--velvet);border:1px solid var(--line);
  animation:pulse 1.3s ease-in-out infinite}
.bone:nth-child(2){animation-delay:.15s}
.bone:nth-child(3){animation-delay:.3s}

.shelf{width:100%;margin-top:42px;text-align:left}
.shelf h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:1.25rem;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:11px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--cream-soft);
  font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
.tab.active{border-color:var(--brass);color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.cell{position:relative;cursor:pointer;animation:rise .4s backwards}
.cell img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;display:block;background:var(--velvet)}
.cell p{font-size:.66rem;line-height:1.3;color:var(--cream-soft);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .x{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;background:rgba(21,10,16,.82);
  color:var(--paper);border:none;font-size:.85rem;line-height:1;cursor:pointer}
.blank{color:var(--ink-soft);font-size:.83rem;line-height:1.6;padding:16px 0}

.keep{display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.keep button{flex:1;padding:11px 6px;background:transparent;border:1px solid var(--line);border-radius:4px;
  color:var(--cream-soft);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.1em;cursor:pointer;
  transition:all .2s}
.keep button:active{transform:scale(.97)}
.keep-note{font-size:.72rem;color:var(--ink-soft);margin-top:9px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--velvet);border:1px solid var(--line);color:var(--paper);padding:12px 20px;border-radius:4px;
  font-size:.82rem;opacity:0;pointer-events:none;transition:all .25s;z-index:95;max-width:320px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="curtain l" id="curtainL"><span></span></div>
<div class="curtain r" id="curtainR"><span></span></div>
<div class="dimmer" id="dimmer"></div>

<div class="wrap">

  <div class="bulbs" id="bulbs"></div>
  <div class="eyebrow" id="eyebrow">BUGÜN VİZYONDA</div>
  <h1>Demet'in Sinema Odası</h1>
  <p class="tagline">Üç bilet çek, akşamın filmi belli olsun.</p>

  <div class="filters">
    <div class="field">
      <label for="catSelect">NE İZLEYELİM</label>
      <select id="catSelect">
        <option value="movie|">Filmler</option>
        <option value="movie|tr">Türk filmleri</option>
        <option value="movie|!tr">Yabancı filmler</option>
        <option value="tv|">Diziler</option>
        <option value="tv|tr">Türk dizileri</option>
        <option value="tv|!tr">Yabancı diziler</option>
      </select>
    </div>

    <div class="field">
      <label for="genreSelect">TÜR</label>
      <select id="genreSelect"></select>
    </div>

    <div class="field hide" id="platformField">
      <label for="platformSelect">PLATFORM</label>
      <select id="platformSelect"><option value="">Hepsi</option></select>
    </div>

    <div class="field half">
      <label for="yearSelect">YIL</label>
      <select id="yearSelect">
        <option value="">Fark etmez</option>
        <option value="2020">2020 sonrası</option>
        <option value="2010">2010'lar</option>
        <option value="2000">2000'ler</option>
        <option value="1990">90'lar</option>
        <option value="1980">80'ler</option>
        <option value="old">80 öncesi klasikler</option>
      </select>
    </div>

    <div class="field half">
      <label for="scoreSelect">PUAN</label>
      <select id="scoreSelect">
        <option value="">Fark etmez</option>
        <option value="6">6 ve üstü</option>
        <option value="7">7 ve üstü</option>
        <option value="8">8 ve üstü</option>
      </select>
    </div>
  </div>

  <div class="draws">
    <button class="draw" id="drawBtn">🎟 ÜÇ BİLET ÇEK</button>
    <button class="draw ghost" id="surpriseBtn">✉️ SÜRPRİZ ZARF</button>
  </div>

  <div class="bones" id="bones"><div class="bone"></div><div class="bone"></div><div class="bone"></div></div>

  <div class="envelope" id="envelope">
    <div class="wax">✦</div>
    <div class="env-label">BU AKŞAMIN SÜRPRİZİ</div>
    <div class="env-meta" id="envMeta"></div>
    <div class="env-clue" id="envClue"></div>
    <button class="env-open" id="envOpen">ZARFI AÇ</button>
    <button class="env-skip" id="envSkip">BAŞKA BİR ZARF VER</button>
  </div>

  <div class="strip" id="strip"></div>
  <div class="strip-note" id="stripNote">BİRİNE DOKUN, BİLETİ AÇILSIN</div>

  <div class="ticket" id="ticket">
    <img class="poster" id="poster" src="" alt="">
    <div class="body">
      <div class="kinds" id="kinds"></div>
      <div class="title" id="title"></div>
      <div class="facts" id="facts"></div>
      <div class="overview" id="overview"></div>
      <div class="sect" id="castSect">
        <div class="sect-label">OYUNCULAR</div>
        <div class="cast" id="cast"></div>
      </div>
      <div class="sect" id="where">
        <div class="sect-label">NEREDE İZLENİR</div>
        <div class="logos" id="logos"></div>
      </div>
    </div>
    <div class="perf"><span class="notch l"></span><span class="notch r"></span></div>
    <div class="stub">
      <div class="stub-top">
        <div class="score"><b id="score">—</b><i>PUAN</i></div>
        <div class="acts">
          <button class="act" id="favBtn">♡ Favori</button>
          <button class="act" id="seenBtn">İzledim</button>
        </div>
      </div>
      <div id="trailerBox"></div>
      <div class="extras">
        <button id="calBtn">🗓 SEANSA EKLE</button>
        <button id="shareBtn">↗ BİLETİ PAYLAŞ</button>
      </div>
    </div>
  </div>

  <div class="shelf">
    <h2>Demet'in Rafı</h2>
    <div class="tabs">
      <button class="tab active" id="tabFav">FAVORİLER</button>
      <button class="tab" id="tabSeen">İZLENENLER</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="blank" id="blank"></div>
    <div class="keep">
      <button id="saveBtn">↓ RAFI YEDEKLE</button>
      <button id="loadBtn">↑ YEDEĞİ YÜKLE</button>
    </div>
    <p class="keep-note">Raf sadece bu tarayıcıda saklanıyor. Arada bir yedek alıp telefonuna kaydetmen iyi olur.</p>
    <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
  </div>

</div>
<div class="toast" id="toast"></div>
<button class="lights" id="lightsBtn">☀ IŞIKLARI AÇ</button>

<script>
/* ===== eski service worker / onbellek temizligi ===== */
(function(){try{
  if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations()
    .then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
  if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){})}
}catch(e){}})();

var API_KEY="91a5fe677d52ce465948f464c3cfd53b";
var BASE="https://api.themoviedb.org/3";

/* ===== depolama ===== */
function get(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function keyOf(m){return (m.media||"movie")+":"+m.id}
function has(k,m){var q=keyOf(m);return get(k).some(function(x){return keyOf(x)===q})}
function slim(m){return{id:m.id,media:m.media||"movie",title:m.title,poster_path:m.poster_path,
  overview:m.overview,vote_average:m.vote_average,date:m.date,genre_ids:m.genre_ids||[]}}

/* tek tip nesne: film ve dizi ayni sekilde kullanilsin */
function normalize(x,media){
  return{id:x.id,media:media,
    title:media==="tv"?(x.name||x.original_name||""):(x.title||x.original_title||""),
    poster_path:x.poster_path,overview:x.overview,vote_average:x.vote_average,
    date:media==="tv"?(x.first_air_date||""):(x.release_date||""),
    original_language:x.original_language,
    genre_ids:x.genre_ids||[]};
}

/* ===== ag ===== */
function ask(path,params){
  var url=BASE+path+"?api_key="+API_KEY+"&language=tr-TR";
  for(var k in params){if(params[k]!==""&&params[k]!=null)url+="&"+k+"="+encodeURIComponent(params[k])}
  var ctrl=("AbortController" in window)?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},12000);
  return fetch(url,ctrl?{signal:ctrl.signal}:undefined).then(function(r){
    clearTimeout(timer);
    if(!r.ok){var e=new Error("HTTP "+r.status);e.status=r.status;throw e}
    return r.json();
  },function(e){clearTimeout(timer);throw e});
}

function filters(){
  var cat=$("catSelect").value.split("|");
  return{media:cat[0],lang:cat[1]||"",
    genre:$("genreSelect")?$("genreSelect").value:"",platform:$("platformSelect")?$("platformSelect").value:"",
    year:$("yearSelect").value,score:$("scoreSelect").value};
}

function minVotes(f){
  if(f.lang==="tr")return f.media==="tv"?8:15;
  return f.media==="tv"?40:120;
}

function discover(f,page){
  var p={sort_by:"popularity.desc",page:page,with_genres:f.genre};
  p["vote_count.gte"]=minVotes(f);
  if(f.media==="movie")p.include_adult="false";
  if(f.lang==="tr")p.with_original_language="tr";
  if(f.platform){p.watch_region="TR";p.with_watch_providers=f.platform;p.with_watch_monetization_types="flatrate"}
  var g=f.media==="tv"?"first_air_date":"primary_release_date";
  if(f.year==="old"){p[g+".lte"]="1979-12-31"}
  else if(f.year==="2020"){p[g+".gte"]="2020-01-01"}
  else if(f.year){
    var y=parseInt(f.year,10);
    p[g+".gte"]=y+"-01-01"; p[g+".lte"]=(y+9)+"-12-31";
  }
  if(f.score)p["vote_average.gte"]=f.score;
  return ask("/discover/"+f.media,p);
}

function pageCount(f){
  var key=[f.media,f.lang,f.genre,f.platform,f.year,f.score].join("|");
  if(pages[key])return Promise.resolve(pages[key]);
  return discover(f,1).then(function(d){
    pages[key]=Math.max(1,Math.min(d.total_pages||1,25));
    return pages[key];
  });
}

function loadPlatforms(){
  ask("/watch/providers/movie",{watch_region:"TR"}).then(function(d){
    var all=d.results||[], picked=[];
    WANTED.forEach(function(name){
      var hit=all.filter(function(p){return p.provider_name===name})[0];
      if(hit)picked.push(hit);
    });
    if(picked.length<2)return;
    var sel=$("platformSelect");
    picked.forEach(function(p){
      var o=document.createElement("option");
      o.value=p.provider_id; o.text=p.provider_name;
      sel.appendChild(o);
    });
    $("platformField").className="field";
  }).catch(function(){});
}

function fillGenres(){
  var f=filters();
  var list=f.media==="tv"?TV_GENRES:MOVIE_GENRES;
  var sel=$("genreSelect"), old=sel?sel.value:"";
  sel.innerHTML="";
  list.forEach(function(g){
    var o=document.createElement("option");
    o.value=g[0]; o.text=g[1];
    sel.appendChild(o);
  });
  var still=list.some(function(g){return g[0]===old});
  sel.value=still?old:"";

function shutCurtain(){
  $("curtainL").classList.add("shut");
  $("curtainR").classList.add("shut");
}
function openCurtain(){
  setTimeout(function(){
    $("curtainL").classList.remove("shut");

/* ===== isiklar ===== */
var dimAt=0;
function lightsOut(){
  dimAt=Date.now();
  document.body.classList.add("dark");
  $("dimmer").classList.add("on");
}
function lightsOn(){
  if(!document.body.classList.contains("dark"))return;
  document.body.classList.remove("dark");
  $("dimmer").classList.remove("on");
  renderTrailer();
}

/* ===== cekilis ===== */
function fetchBatch(f,count){
  return pageCount(f).then(function(tp){
    return discover(f,Math.floor(Math.random()*tp)+1);
  }).then(function(d){
    var seen=get(K_HIST);
    var pool=(d.results||[]).map(function(x){return normalize(x,f.media)})
      .filter(function(m){return m.poster_path&&m.overview&&m.overview.length>20&&m.title});
    if(f.lang==="!tr")pool=pool.filter(function(m){return m.original_language!=="tr"});
    var fresh=pool.filter(function(m){return seen.indexOf(keyOf(m))===-1});
    if(fresh.length>=count)pool=fresh;
    if(!pool.length){var e=new Error("EMPTY");e.code="EMPTY";throw e}
    var out=shuffle(pool).slice(0,count);
    out.forEach(function(m){remember(m)});
    return out;
  });
}

function draw(){
  if(loading)return;
  var f=filters();
  setLoading(true);
  shutCurtain();
  Promise.all([fetchBatch(f,3),wait(460)]).then(function(res){
    $("envelope").className="envelope";
    picks=res[0];
    renderStrip();
    open(picks[0],0,"print");
    openCurtain();
  }).catch(function(e){openCurtain();oops(e)}).then(function(){setLoading(false)});
}

function surprise(){
  if(loading)return;
  var f=filters();
  setLoading(true);
  shutCurtain();
  Promise.all([fetchBatch(f,1),wait(460)]).then(function(res){
    picks=res[0];
    $("strip").className="strip";
    $("stripNote").className="strip-note";
    $("ticket").className="ticket";
    showEnvelope(picks[0]);
    openCurtain();
  }).catch(function(e){openCurtain();oops(e)}).then(function(){setLoading(false)});
}

function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  return a;
}

function remember(m){
  var h=get(K_HIST); h.push(keyOf(m));
  if(h.length>120)h=h.slice(-120);
  put(K_HIST,h);
}

function showEnvelope(m){
  current=m;
  var bits=[];
  var names=(m.genre_ids||[]).map(function(id){return NAMES[id]}).filter(Boolean);
  if(names.length)bits.push(names.slice(0,2).join(" · "));
  if(m.date)bits.push(m.date.split("-")[0]);
  if(m.vote_average)bits.push("★ "+m.vote_average.toFixed(1));
  $("envMeta").innerText=bits.join("   ·   ");
  $("envClue").innerText=clueOf(m);
  var e=$("envelope");
  e.className="envelope";
  void e.offsetWidth;
  e.className="envelope show";
}

function clueOf(m){
  var t=(m.overview||"").replace(/\s+/g," ").trim();
  var stop=t.indexOf(". ");
  var s=(stop>30&&stop<170)?t.slice(0,stop+1):t.slice(0,150);
  (m.title||"").split(/\s+/).forEach(function(w){
    if(w.length>3){
      try{s=s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"•••")}catch(e){}
    }
  });
  if(!s)s="Hakkında pek bir şey söylemeyelim, sürpriz bozulmasın.";
  return "“"+s.trim()+(s.length>=150?"…":"")+"”";
}

/* ===== bilet ===== */
function renderStrip(){
  var s=$("strip"); s.innerHTML="";
  picks.forEach(function(m,i){
    var el=document.createElement("div");
    el.className="pick"+(i===0?" sel":"");
    el.style.animationDelay=(i*90)+"ms";
    var img=document.createElement("img");
    img.src=m.poster_path?IMG+"w200"+m.poster_path:""; img.alt=m.title;
    var tag=document.createElement("div");
    tag.className="tag";
    tag.innerText=(m.vote_average?("★ "+m.vote_average.toFixed(1)):"★ —");
    el.appendChild(img); el.appendChild(tag);
    el.onclick=function(){
      open(m,i,"swap");
      setTimeout(function(){
        var t=$("ticket");
        if(t.getBoundingClientRect().top>window.innerHeight*0.5)
          t.scrollIntoView({behavior:"smooth",block:"start"});
      },60);
    };
    s.appendChild(el);
  });
  s.className="strip show";
  $("stripNote").className=picks.length>1?"strip-note show":"strip-note";
}

function mark(i){
  var kids=$("strip").children;
  for(var k=0;k<kids.length;k++)kids[k].className="pick"+(k===i?" sel":"");
}

function open(m,i,mode){
  current=m; trailerKey=null;
  lightsOn();
  if(i>=0)mark(i);
  $("envelope").className="envelope";
  var t=$("ticket");
  t.style.setProperty("--accent","#8A6A2A");
  $("poster").src=m.poster_path?IMG+"w500"+m.poster_path:"";
  $("poster").alt=m.title+" afişi";
  $("title").innerText=m.title;
  $("overview").innerText=m.overview||"Bu yapım için Türkçe özet bulunamadı.";
  $("score").innerText=m.vote_average?m.vote_average.toFixed(1):"—";
  var names=(m.genre_ids||[]).map(function(id){return NAMES[id]}).filter(Boolean);
  var head=names.slice(0,3).join("  ·  ");
  $("kinds").innerText=(m.media==="tv"?"DİZİ":"FİLM")+(head?("   ·   "+head):"");
  setFacts(m,null);
  $("castSect").className="sect"; $("cast").innerHTML="";
  $("where").className="sect"; $("logos").innerHTML="";
  renderTrailer();
  buttons();

  t.className="ticket";
  void t.offsetWidth;
  t.className="ticket show "+(mode||"swap");

  accentFrom(m);
  details(m);
}

function details(m){
  var k=keyOf(m);
  if(dcache[k]){paint(m,dcache[k]);return}
  ask("/"+m.media+"/"+m.id,{append_to_response:"credits,videos,watch/providers",include_video_language:"tr,en"})
    .then(function(d){dcache[k]=d;paint(m,d)}).catch(function(){});
}

function paint(m,d){
  if(!current||keyOf(current)!==keyOf(m))return;
  setFacts(m,d);
  showCast(d.credits);
  showWhere(d["watch/providers"]);
  trailerKey=pickVideo(d.videos);
  renderTrailer();
}

function setFacts(m,d){
  var bits=[];
  if(m.date)bits.push(m.date.split("-")[0]);
  if(d){
    if(m.media==="tv"){
      if(d.number_of_seasons)bits.push(d.number_of_seasons+" sezon");
      if(d.number_of_episodes)bits.push(d.number_of_episodes+" bölüm");
    }else if(d.runtime){
      var h=Math.floor(d.runtime/60), mn=d.runtime%60;
      bits.push(h?(h+" sa "+mn+" dk"):(mn+" dk"));
    }
  }
  $("facts").innerText=bits.join("   ·   ");
}

function showWhere(wp){
  var tr=wp&&wp.results&&wp.results.TR;
  if(!tr)return;
  var all=[].concat(tr.flatrate||[],tr.free||[],tr.ads||[]);
  var seen={},uniq=[];

  if(!uniq.length)return;
  var box=$("logos"); box.innerHTML="";
  uniq.slice(0,6).forEach(function(p,i){

    el.className="logo"; el.style.animationDelay=(i*50)+"ms";

    el.querySelector("span").innerText=p.provider_name;
    box.appendChild(el);

function pickVideo(v){
  var a=(v&&v.results)||[];
  var yt=a.filter(function(x){return x.site==="YouTube"});
  var p=yt.filter(function(x){return x.type==="Trailer"})[0]
       ||yt.filter(function(x){return x.type==="Teaser"})[0]||yt[0];
  return p?p.key:null;
}

/* ===== afisten renk ===== */
function accentFrom(m){
  if(!m.poster_path)return;
  try{
    var img=new Image();
    img.crossOrigin="anonymous";
    img.onload=function(){
      try{
        if(!current||keyOf(current)!==keyOf(m))return;
        var n=20, c=document.createElement("canvas");
        c.width=n; c.height=n;
        var x=c.getContext("2d");
        x.drawImage(img,0,0,n,n);
        var d=x.getImageData(0,0,n,n).data;
        var r=0,g=0,b=0,k=0;
        for(var i=0;i<d.length;i+=4){
          var lum=(d[i]+d[i+1]+d[i+2])/3;
          if(lum<25||lum>235)continue;
          r+=d[i];g+=d[i+1];b+=d[i+2];k++;
        }
        if(!k)return;
        r=r/k;g=g/k;b=b/k;
        var f=0.52;
        r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);
        var col="rgb("+r+","+g+","+b+")";
        $("ticket").style.setProperty("--accent",col);
      }catch(e){}
    };
    img.onerror=function(){};
    img.src=IMG+"w185"+m.poster_path;
  }catch(e){}
}

/* ===== bilet gorseli ===== */
function ticketNo(m){
  var s=String(m.id||0);
  while(s.length<6)s="0"+s;
  return s.slice(-6);
}

function wrapText(x,text,maxW,maxLines){
  var words=String(text).split(/\s+/), lines=[], line="";
  for(var i=0;i<words.length;i++){
    var t=line?line+" "+words[i]:words[i];
    if(x.measureText(t).width>maxW&&line){lines.push(line);line=words[i]}
    else line=t;
    if(lines.length===maxLines)break;
  }
  if(line&&lines.length<maxLines)lines.push(line);
  return lines;
}

function buildTicketImage(m){
  return new Promise(function(resolve,reject){
    var W=1080,H=1840,PAD=60;
    var c=document.createElement("canvas");
    c.width=W; c.height=H;
    var x=c.getContext("2d");

    function paintAll(poster){
      x.fillStyle="#F3EADC"; x.fillRect(0,0,W,H);
      var pw=W-PAD*2, ph=Math.round(pw*1.5), py=PAD;
      x.fillStyle="#E7DACA"; x.fillRect(PAD,py,pw,ph);
      if(poster){
        var s=Math.max(pw/poster.width,ph/poster.height);
        var dw=poster.width*s, dh=poster.height*s;
        x.save();
        x.beginPath(); x.rect(PAD,py,pw,ph); x.clip();
        x.drawImage(poster,PAD+(pw-dw)/2,py+(ph-dh)/2,dw,dh);
        x.restore();
      }
      var ly=py+ph+58;
      x.strokeStyle="rgba(42,23,32,.32)"; x.lineWidth=3;
      x.setLineDash([14,14]);
      x.beginPath(); x.moveTo(PAD,ly); x.lineTo(W-PAD,ly); x.stroke();
      x.setLineDash([]);
      x.fillStyle="#150A10";
      x.beginPath(); x.arc(0,ly,34,0,Math.PI*2); x.fill();
      x.beginPath(); x.arc(W,ly,34,0,Math.PI*2); x.fill();

      var ty=ly+92;
      x.fillStyle="#8A6A2A";
      x.font="600 30px 'Space Mono',monospace";
      x.fillText((m.media==="tv"?"DİZİ":"FİLM")+"   ·   BİLET NO "+ticketNo(m),PAD,ty);

      ty+=76;
      x.fillStyle="#2A1720";
      x.font="600 68px 'Bodoni Moda',Georgia,serif";
      var lines=wrapText(x,m.title,W-PAD*2,2);
      lines.forEach(function(t){x.fillText(t,PAD,ty); ty+=80});

      ty+=6;
      x.fillStyle="#6B5460";
      x.font="400 34px 'Space Mono',monospace";
      var meta=[];
      if(m.date)meta.push(m.date.split("-")[0]);
      if(m.vote_average)meta.push("★ "+m.vote_average.toFixed(1));
      x.fillText(meta.join("   ·   "),PAD,ty);

      x.fillStyle="#8A6A2A";
      x.font="700 30px 'Space Mono',monospace";
      var brand="DEMET'İN SİNEMA ODASI";
      x.fillText(brand,PAD,H-PAD-6);

      c.toBlob(function(blob){
        blob?resolve(blob):reject(new Error("blob"));
      },"image/png");
    }

    if(!m.poster_path){paintAll(null);return}
    var img=new Image();
    img.crossOrigin="anonymous";
    img.onload=function(){paintAll(img)};
    img.onerror=function(){paintAll(null)};
    img.src=IMG+"w780"+m.poster_path;
  });
}

function shareTicket(){
  if(!current)return;
  var m=current;
  say("Bilet hazırlanıyor…");
  buildTicketImage(m).then(function(blob){
    var file=new File([blob],"bilet.png",{type:"image/png"});
    var text="Bu akşam bunu izleyelim mi? "+m.title;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],text:text}).catch(function(){});
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="sinema-odasi-bilet.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    say("Bilet görseli kaydedildi");
  }).catch(function(){shareText()});
}

function shareText(){
  if(!current)return;
  var yil=current.date?(" ("+current.date.split("-")[0]+")"):"";
  var link=trailerKey?("\nFragman: https://www.youtube.com/watch?v="+trailerKey):"";
  var text="Bu akşam bunu izleyelim mi? "+current.title+yil+link;
  if(navigator.share){navigator.share({title:current.title,text:text}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(text)
    .then(function(){say("Kopyalandı, yapıştırman yeterli")}).catch(function(){say("Kopyalanamadı")})}
  else{say("Paylaşma desteklenmiyor")}
}

/* ===== seans / takvim ===== */
function pad2(n){return n<10?("0"+n):(""+n)}
function icsStamp(d){
  return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+"T"+
    pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+"00Z";
}
function addToCalendar(){
  if(!current)return;
  var now=new Date();
  var start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),21,30,0);
  if(start.getTime()<now.getTime()+15*60000)start=new Date(start.getTime()+86400000);
  var end=new Date(start.getTime()+2*3600000);
  var title="Sinema Odası — "+current.title;
  var desc="Demet'in Sinema Odası seansı.";
  if(trailerKey)desc+=" Fragman: https://www.youtube.com/watch?v="+trailerKey;
  var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sinema Odasi//TR","BEGIN:VEVENT",
    "UID:"+keyOf(current)+"-"+Date.now()+"@sinemaodasi",
    "DTSTAMP:"+icsStamp(new Date()),
    "DTSTART:"+icsStamp(start),
    "DTEND:"+icsStamp(end),
    "SUMMARY:"+title.replace(/[,;]/g," "),
    "DESCRIPTION:"+desc.replace(/[,;]/g," "),
    "BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:Seans yaklaşıyor","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  try{
    var blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="seans.ics";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    say(pad2(start.getHours())+":"+pad2(start.getMinutes())+" seansı takvime hazır");
  }catch(e){say("Takvime eklenemedi")}
}

/* ===== raf ===== */
function buttons(){
  if(!current)return;
  var f=$("favBtn"), s=$("seenBtn");
  var isF=has(K_FAV,current), isS=has(K_SEEN,current);
  f.className="act"+(isF?" on":"");
  f.innerText=isF?"♥ Favorimde":"♡ Favori";
  s.className="act"+(isS?" on seen":"");
  s.innerText=isS?"✓ İzledim":"İzledim";
}

function toggle(key,label){
  if(!current)return;
  var q=keyOf(current), list=get(key);
  var i=-1;
  for(var k=0;k<list.length;k++){if(keyOf(list[k])===q){i=k;break}}
  if(i>-1){list.splice(i,1);say(label+" listesinden çıkarıldı")}
  else{list.unshift(slim(current));say(label+" listesine eklendi")}
  put(key,list); buttons(); shelf();
}

function shelf(){
  var key=tab==="fav"?K_FAV:K_SEEN;
  var list=get(key), grid=$("grid"), blank=$("blank");
  grid.innerHTML="";
  if(!list.length){
    blank.style.display="block";
    blank.innerText=tab==="fav"
      ?"Raf henüz boş. Beğendiğin bir bilet çıkınca kalbe dokun, burada dursun."
      :"İzlediklerini işaretledikçe burada birikecek.";
    return;
  }
  blank.style.display="none";
  list.forEach(function(m,i){
    if(!m.media)m.media="movie";
    var cell=document.createElement("div");
    cell.className="cell";
    cell.style.animationDelay=Math.min(i*40,400)+"ms";
    var img=document.createElement("img");
    img.src=m.poster_path?IMG+"w200"+m.poster_path:"";
    img.alt=m.title; img.loading="lazy";
    var cap=document.createElement("p"); cap.innerText=m.title;
    cell.onclick=function(){
      picks=[m]; renderStrip(); open(m,0,"swap");
      window.scrollTo({top:0,behavior:"smooth"});
    };
    var x=document.createElement("button");
    x.className="x"; x.innerText="×";
    x.onclick=function(e){
      e.stopPropagation();
      var q=keyOf(m);
      put(key,get(key).filter(function(o){return keyOf(o)!==q}));
      shelf(); buttons(); say("Raftan çıkarıldı");
    };
    cell.appendChild(img); cell.appendChild(x); cell.appendChild(cap);
    grid.appendChild(cell);
  });
}

function switchTab(t){
  tab=t;
  $("tabFav").className="tab"+(t==="fav"?" active":"");
  $("tabSeen").className="tab"+(t==="seen"?" active":"");
  shelf();
}

/* ===== yedek ===== */
function backup(){
  var data={app:"Demet'in Sinema Odası",v:2,tarih:new Date().toISOString(),
    favoriler:get(K_FAV),izlenenler:get(K_SEEN)};
  try{
    var blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="sinema-odasi-yedek.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    say("Yedek dosyası hazır");
  }catch(e){say("Yedek alınamadı")}
}

function restore(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      var f=merge(get(K_FAV),d.favoriler||[]);
      var s=merge(get(K_SEEN),d.izlenenler||[]);
      put(K_FAV,f); put(K_SEEN,s);
      shelf(); buttons();
      say("Yedek yüklendi: "+f.length+" favori, "+s.length+" izlenen");
    }catch(e){say("Dosya okunamadı, doğru yedek mi?")}
  };
  r.onerror=function(){say("Dosya açılamadı")};
  r.readAsText(file);
}

function merge(a,b){
  var seen={},out=[];
  a.concat(b).forEach(function(m){
    if(!m||!m.id)return;
    if(!m.media)m.media="movie";
    var q=keyOf(m);
    if(!seen[q]){seen[q]=1;out.push(m)}
  });
  return out;
}

/* ===== durum & bildirim ===== */
function setLoading(on){
  loading=on;
  $("drawBtn").disabled=on;
  $("surpriseBtn").disabled=on;
  $("bulbs").className=on?"bulbs on":"bulbs";
  $("bones").className=on?"bones show":"bones";
  if(on){
    lightsOn();
    $("strip").className="strip";
    $("stripNote").className="strip-note";
    $("ticket").className="ticket";
    $("envelope").className="envelope";
  }
}

function oops(e){
  var msg="Bir aksilik oldu, tekrar dener misin?";
  if(e&&e.name==="AbortError")msg="Bağlantı ağır, tekrar dene.";
  else if(!navigator.onLine)msg="İnternet bağlantısı yok.";
  else if(e&&e.status===401)msg="API anahtarı geçersiz görünüyor.";
  else if(e&&e.status===429)msg="Biraz hızlı gittik, bir saniye bekle.";
  else if(e&&e.code==="EMPTY")msg="Bu seçimlerle bir şey çıkmadı, filtreleri gevşet.";
  say(msg);
}

var tt;
function say(m){
  var t=$("toast"); t.innerText=m; t.className="toast show";
  clearTimeout(tt); tt=setTimeout(function(){t.className="toast"},2600);
}

fillGenres();
$("catSelect").onchange=function(){fillGenres()};
$("drawBtn").onclick=draw;
$("surpriseBtn").onclick=surprise;
$("envOpen").onclick=function(){if(picks[0])open(picks[0],-1,"print")};
$("envSkip").onclick=surprise;
$("favBtn").onclick=function(){toggle(K_FAV,"Favori")};
$("seenBtn").onclick=function(){toggle(K_SEEN,"İzlenenler")};
$("shareBtn").onclick=shareTicket;
$("calBtn").onclick=addToCalendar;
$("lightsBtn").onclick=lightsOn;
document.addEventListener("click",function(e){
  if(!document.body.classList.contains("dark"))return;
  if(Date.now()-dimAt<600)return;
  if(!document.body.contains(e.target))return;
  var t=$("ticket");
  if(t&&!t.contains(e.target))lightsOn();
});
$("tabFav").onclick=function(){switchTab("fav")};
$("tabSeen").onclick=function(){switchTab("seen")};
$("saveBtn").onclick=backup;
$("loadBtn").onclick=function(){$("fileInput").click()};
$("fileInput").onchange=function(e){
  var f=e.target.files&&e.target.files[0];
  if(f)restore(f);
  e.target.value="";
};

loadPlatforms();
shelf();
