<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demet'in Sinema Odası</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .header { margin-top: 15px; margin-bottom: 20px; }
        .header h1 { color: #ff4d6d; font-size: 1.8rem; margin-bottom: 5px; }
        .header p { color: #a0a0a0; font-size: 0.9rem; }
        .card { background: #1e1e1e; border-radius: 16px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #2a2a2a; display: none; margin-bottom: 25px; margin-top: 15px; }
        .poster { width: 100%; height: 380px; object-fit: cover; }
        .content { padding: 20px; }
        .title { font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .meta { display: flex; justify-content: center; gap: 15px; margin-bottom: 12px; font-size: 0.9rem; color: #ffb703; }
        .overview { font-size: 0.9rem; color: #ccc; line-height: 1.4; margin-bottom: 20px; text-align: left; }
        .btn-trailer { display: inline-block; width: 100%; padding: 12px; background-color: #ff0000; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
        .btn-main { background: linear-gradient(135deg, #ff4d6d, #c9184a); color: white; border: none; padding: 16px 32px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4); transition: transform 0.2s; }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 Demet'in Sinema Odası</h1>
        <p>Bugün ne izlesek diye düşünmeye son!</p>
    </div>

    <button class="btn-main" onclick="fetchRandomMovie()">🎲 Rastgele Film Getir</button>

    <div class="card" id="movieCard">
        <img src="" alt="Poster" class="poster" id="poster">
        <div class="content">
            <div class="title" id="title"></div>
            <div class="meta">
                <span id="rating">⭐ 0.0</span>
                <span id="year">📅 2026</span>
            </div>
            <div class="overview" id="overview"></div>
            <a href="#" target="_blank" class="btn-trailer" id="trailerBtn">▶ Fragmanı YouTube'da İzle</a>
        </div>
    </div>

    <script>
        const movies = [
            {
                title: "Inception (Başlangıç)",
                rating: "⭐ 8.8",
                year: "📅 2010",
                poster: "https://image.tmdb.org/t/p/w500/edv5CZv27jnR33A3vP32OH2L33A.jpg",
                overview: "Çok yetenekli bir hırsız olan Dom Cobb'un uzmanlık alanı, zihnin en savunmasız olduğu rüya anında, bilinçaltının derinliklerindeki değerli sırları çekip çıkarmak ve onları çalmaktır."
            },
            {
                title: "Interstellar (Yıldızlararası)",
                rating: "⭐ 8.7",
                year: "📅 2014",
                poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
                overview: "İnsanlığın sonu yaklaşırken, bir grup kaşif insan türünün uzayda geleceğini garantilemek için bir solucan deliğinden geçerek bilinmeyene doğru yolculuk eder."
            },
            {
                title: "The Dark Knight (Kara Şövalye)",
                rating: "⭐ 9.0",
                year: "📅 2008",
                poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
                overview: "Batman, Teğmen Gordon ve Savcı Harvey Dent ile birlikte Gotham Şehri'ni suç örgütlerinden temizlemeye çalışırken, Joker adlı kaotik bir suç dehasıyla yüzleşir."
            },
            {
                title: "Oppenheimer",
                rating: "⭐ 8.1",
                year: "📅 2023",
                poster: "https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGvC3P1q0my.jpg",
                overview: "Fizikçi J. Robert Oppenheimer'ın II. Dünya Savaşı sırasında Manhattan Projesi kapsamında atom bombasını geliştirme sürecini ve sonrasındaki vicdani hesaplaşmasını anlatıyor."
            },
            {
                title: "La La Land (Aşıklar Şehri)",
                rating: "⭐ 8.0",
                year: "📅 2016",
                poster: "https://image.tmdb.org/t/p/w500/uDO8493f2y3I34CAn931yI9P31f.jpg",
                overview: "Los Angeles'ta tutkulu bir caz piyanisti ile oyuncu olmaya çalışan genç bir kadının, hayallerini kovalarken yaşadıkları büyüleyici aşk hikayesi."
            },
            {
                title: "Spirited Away (Ruhların Kaçışı)",
                rating: "⭐ 8.5",
                year: "📅 2001",
                poster: "https://image.tmdb.org/t/p/w500/3939237373.jpg",
                overview: "Ailesiyle yeni bir eve taşınırken gizemli bir dünyaya adım atan 10 yaşındaki Chihiro'nun, domuza dönüşen ailesini kurtarma mücadelesi."
            },
            {
                title: "Parasite (Parazit)",
                rating: "⭐ 8.5",
                year: "📅 2019",
                poster: "https://image.tmdb.org/t/p/w500/7IiT389839.jpg",
                overview: "Sokak seviyesindeki bir bodrum katında yaşayan yoksul Kim ailesinin, zengin Park ailesinin hizmetine girmesiyle başlayan gerilim dolu toplumsal kara komedi."
            },
            {
                title: "Whiplash",
                rating: "⭐ 8.5",
                year: "📅 2014",
                poster: "https://image.tmdb.org/t/p/w500/oE88383838.jpg",
                overview: "Genç ve hırslı bir davulcu ile sınırları zorlayan acımasız bir orkestra şefinin arasındaki psikolojik ve müzikal mücadele."
            },
            {
                title: "Dune: Part Two (Dune: Çöl Gezegeni Bölüm İki)",
                rating: "⭐ 8.5",
                year: "📅 2024",
                poster: "https://image.tmdb.org/t/p/w500/1pdfLPoL3838.jpg",
                overview: "Paul Atreides'in ailesini yok eden komplo sahiplerine karşı başlattığı intikam savaşı ve Arrakis gezegeninin kaderini değiştirme çabası."
            }
        ];

        // Çalışan alternatif görsel adresleri
        const posters = [
            "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_FMjpg_UX1000_.jpg",
            "https://m.media-amazon.com/images/M/MV5BYzdjMDAxZGItMTI2My00MzA1LWFjNTctNTI2ODgzZmJhM2I3XkEyXkFqcGc@._V1_.jpg",
            "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg",
            "https://m.media-amazon.com/images/M/MV5BN2JkMDc5MGQtZmVlMy00NmE5LWEzMDItM2FiOTM4NTcxMjg0XkEyXkFqcGc@._V1_.jpg",
            "https://m.media-amazon.com/images/M/MV5BMzUzNDM2NzM2MV5BMl5BanBnXkFtZTgwNTM3NTg4OTE@._V1_.jpg"
        ];

        function fetchRandomMovie() {
            const card = document.getElementById('movieCard');
            const randomMovie = movies[Math.floor(Math.random() * movies.length)];
            
            document.getElementById('poster').src = posters[Math.floor(Math.random() * posters.length)];
            document.getElementById('title').innerText = randomMovie.title;
            document.getElementById('rating').innerText = randomMovie.rating;
            document.getElementById('year').innerText = randomMovie.year;
            document.getElementById('overview').innerText = randomMovie.overview;
            document.getElementById('trailerBtn').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(randomMovie.title + " fragman")}`;

            card.style.display = 'block';
        }
    </script>
</body>
</html>
