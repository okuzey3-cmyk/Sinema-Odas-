<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Demet'in Sinema Odası</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#150A10;--brass:#D9A441;--cream:#F5EFE6;--mut:#b8aca0;--wine:#6e1a2b;--sans:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vw/120);background:var(--bg)}
body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--sans);font-size:1.15rem;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
[hidden]{display:none!important}

/* acilis perdesi */
#acilis{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;transition:opacity .7s ease}
#acilis img{width:11rem;height:11rem;border-radius:2.4rem;box-shadow:0 0 6rem rgba(217,164,65,.35);animation:nefes 1.6s ease-in-out infinite alternate}
#acilis span{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:3rem;color:var(--brass);letter-spacing:.03em}
#acilis.git{opacity:0;pointer-events:none}
@keyframes nefes{from{transform:scale(.96)}to{transform:scale(1.04)}}

/* arka plan: odaklanan filmin sahnesi */
.arka{position:fixed;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center 18%;opacity:0;transition:opacity .9s ease}
.arka.acik{opacity:1}
#perde{position:fixed;top:0;left:0;right:0;bottom:0;background:
  linear-gradient(90deg,rgba(21,10,16,.98) 0%,rgba(21,10,16,.86) 28%,rgba(21,10,16,.30) 62%,rgba(21,10,16,.05) 100%),
  linear-gradient(0deg,rgba(21,10,16,1) 0%,rgba(21,10,16,.92) 26%,rgba(21,10,16,0) 58%),
  linear-gradient(180deg,rgba(21,10,16,.85) 0%,rgba(21,10,16,0) 15%)}

/* ust serit */
#ust{position:fixed;top:0;left:0;right:0;height:6.4rem;display:flex;align-items:center;gap:3.2rem;padding:0 4.4rem;z-index:5}
.marka{display:flex;align-items:center;gap:1rem}
.marka img{width:3.4rem;height:3.4rem;border-radius:.8rem}
.marka span{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:1.55rem;color:var(--brass);letter-spacing:.02em}
#nav{display:flex;gap:.4rem;flex:1;align-items:center}
.sekme{padding:.65rem 1.5rem;border-radius:2rem;font-size:1.25rem;font-weight:500;color:var(--mut);transition:background .18s,color .18s,transform .18s}
.sekme.secili{color:#fff;font-weight:700}
.sekme.sag{margin-left:auto}
.sekme:focus{background:var(--cream);color:#1a0e14;transform:scale(1.07);box-shadow:0 .4rem 1.6rem rgba(0,0,0,.45)}
#saat{font-size:1.3rem;font-weight:500;color:var(--mut);letter-spacing:.04em;margin-left:1.4rem}

/* kahraman metni */
#kahraman{position:fixed;left:4.4rem;top:8.6rem;width:50rem;z-index:2;transition:opacity .35s}
#hEtiket{font-size:1.05rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:.9rem}
#hBaslik{font-weight:800;font-size:4.6rem;line-height:1.02;letter-spacing:-.02em;text-shadow:0 .2rem 1.6rem rgba(0,0,0,.55);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hMeta{margin-top:1.1rem;font-size:1.2rem;font-weight:500;color:#e8dfd2;display:flex;gap:1.1rem;align-items:center}
#hMeta .puan{background:var(--brass);color:#1a0e14;padding:.1rem .65rem;border-radius:.4rem;font-weight:800}
#hMeta span+span:before{content:"·";margin-right:1.1rem;color:var(--mut)}
#hMeta .puan:before{content:none!important}
#hOzet{margin-top:1rem;font-size:1.2rem;line-height:1.55;color:#d9cfc1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:44rem}
#hIpucu{margin-top:1.3rem;display:inline-flex;align-items:center;gap:.7rem;background:var(--cream);color:#1a0e14;font-weight:700;font-size:1.15rem;padding:.7rem 1.5rem;border-radius:.9rem}
.ge{animation:belir .45s ease both}
@keyframes belir{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}

/* satirlar */
#satirlar{position:fixed;left:0;right:0;top:30.5rem;bottom:0;overflow:hidden;padding:0 0 18rem;z-index:3;scroll-behavior:smooth}
.blok{margin-bottom:.6rem;animation:belir .5s ease both}
.blok h2{font-weight:700;font-size:1.55rem;padding:0 4.4rem;margin-bottom:.2rem;color:var(--cream);letter-spacing:.01em}
.satir{display:flex;gap:1.3rem;overflow:hidden;padding:1.7rem 4.4rem 2.3rem;position:relative;scroll-behavior:smooth}
.kart{flex:0 0 auto;width:12.6rem;height:18.9rem;border-radius:.8rem;overflow:hidden;position:relative;background:#2a1520;transition:transform .22s ease,box-shadow .22s ease}
.kart img{width:100%;height:100%;object-fit:cover;display:block}
.kart .yok{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;font-family:'Bodoni Moda',serif;font-size:1.2rem;color:var(--brass)}
.kart .pu{position:absolute;right:.5rem;top:.5rem;background:rgba(21,10,16,.82);color:var(--brass);font-weight:700;font-size:.95rem;padding:.12rem .5rem;border-radius:.4rem;transition:opacity .2s}
.kart .ad{position:absolute;left:0;right:0;bottom:0;padding:2.6rem .8rem .7rem;background:linear-gradient(0deg,rgba(10,4,8,.95),rgba(10,4,8,0));font-size:1rem;font-weight:700;line-height:1.25;opacity:0;transition:opacity .2s;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kart:focus{transform:scale(1.13);z-index:4;box-shadow:0 0 0 .2rem var(--cream),0 1rem 3rem rgba(0,0,0,.75)}
.kart:focus .ad{opacity:1}
.kart:focus .pu{opacity:0}
/* ilk 10 satiri */
.kart.top{width:22rem;background:none;overflow:visible;border-radius:0}
.kart.top:focus{box-shadow:none}
.kart.top .sira{position:absolute;left:-.4rem;bottom:-1.2rem;font-size:17rem;font-weight:800;line-height:1;letter-spacing:-.06em;color:#150A10;-webkit-text-stroke:.28rem #c9bda9;z-index:0;transition:all .22s}
.kart.top.dd .sira{font-size:13rem;letter-spacing:-.14em;left:-1rem}
.kart.top:focus .sira{-webkit-text-stroke-color:var(--brass)}
.kart.top .pst{position:absolute;right:0;top:0;width:12.6rem;height:18.9rem;border-radius:.8rem;overflow:hidden;background:#2a1520;z-index:1;transition:box-shadow .22s}
.kart.top:focus .pst{box-shadow:0 0 0 .2rem var(--cream),0 1rem 3rem rgba(0,0,0,.75)}
.kart.top .ad{left:auto;width:12.6rem;right:0;z-index:2;border-radius:0 0 .8rem .8rem}
.kart.top .pu{z-index:2}
.mesaj{padding:4rem 4.4rem;font-size:1.4rem;color:var(--mut)}
/* yukleniyor iskeleti */
.iskelet h2{width:18rem;height:1.5rem;margin:0 0 .2rem 4.4rem;border-radius:.4rem;background:#2a1520}
.iskelet .kart{background:linear-gradient(100deg,#251119 30%,#3a1f2b 50%,#251119 70%);background-size:300% 100%;animation:kayar 1.4s linear infinite}
@keyframes kayar{from{background-position:100% 0}to{background-position:-100% 0}}

/* arama */
#arama{position:fixed;left:0;right:0;top:7rem;bottom:0;z-index:4;padding-top:1rem;background:var(--bg)}
#arama .kutu{padding:0 4.4rem 1rem}
#aramaKutu{width:54rem;font-size:1.8rem;padding:.95rem 1.5rem;border-radius:1rem;background:#2a1520;border:.2rem solid #4a2a38}
#aramaKutu:focus{border-color:var(--cream);box-shadow:0 0 1.6rem rgba(245,239,230,.25)}
#aramaSonuc{overflow:hidden;position:absolute;top:6.5rem;bottom:0;left:0;right:0;padding-bottom:10rem;scroll-behavior:smooth}

/* detay */
#detay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;background:var(--bg);animation:belir .35s ease both}
#dArka{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center 15%;opacity:1}
#dIc{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:4.2rem 5rem 2.2rem;background:
  linear-gradient(90deg,rgba(21,10,16,.99) 0%,rgba(21,10,16,.93) 38%,rgba(21,10,16,.55) 72%,rgba(21,10,16,.35) 100%),
  linear-gradient(0deg,rgba(21,10,16,1) 0%,rgba(21,10,16,0) 38%)}
#dUst{display:flex;align-items:center;gap:4rem}
#dPoster{flex:0 0 20.5rem;height:30.7rem;border-radius:1rem;overflow:hidden;box-shadow:0 1.2rem 3.6rem rgba(0,0,0,.75)}
#dPoster img{width:100%;height:100%;object-fit:cover}
#dMetin{flex:1;min-width:0;max-width:68rem}
#dMetin h1{font-weight:800;font-size:3.7rem;line-height:1.04;letter-spacing:-.02em}
#dMeta{margin-top:1rem;color:#e8dfd2;font-size:1.2rem;font-weight:500;display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center}
#dMeta .puan{background:var(--brass);color:#1a0e14;padding:.1rem .65rem;border-radius:.4rem;font-weight:800}
#dMeta span+span:before{content:"·";margin-right:1.1rem;color:var(--mut)}
#dMeta .puan:before{content:none!important}
#dOzet{margin-top:1.1rem;font-size:1.2rem;line-height:1.6;color:#d9cfc1;max-height:9.6rem;overflow:hidden}
#dKadro{margin-top:.8rem;font-size:1.05rem;color:var(--mut)}
.dugmeler{display:flex;gap:1rem;flex-wrap:wrap}
.dugme{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.5rem;border-radius:.9rem;background:rgba(255,255,255,.12);font-size:1.15rem;font-weight:600;transition:background .18s,color .18s,transform .18s,box-shadow .18s}
.dugme img{width:2.3rem;height:2.3rem;border-radius:.5rem}
.dugme.birincil{background:var(--cream);color:#1a0e14;font-size:1.3rem;font-weight:800;padding:.95rem 2rem}
.dugme:focus{background:var(--brass);color:#1a0e14;transform:scale(1.07);box-shadow:0 .5rem 2rem rgba(217,164,65,.5)}
.dugme.birincil:focus{background:#fff;box-shadow:0 0 0 .22rem var(--brass),0 .6rem 2.2rem rgba(0,0,0,.6)}
.not{margin-top:.7rem;color:var(--mut);font-size:1.05rem}
#dBenzerKutu h3{font-weight:700;font-size:1.4rem;margin-bottom:.1rem}
#dBenzer{padding:1.2rem 0 1.5rem;margin:0 -.5rem;padding-left:.5rem}
#dBenzer .kart{width:8.6rem;height:12.9rem}
#dBenzer .kart:focus{transform:scale(1.12)}

#toast{position:fixed;left:50%;bottom:3rem;transform:translateX(-50%);background:var(--cream);color:#1a0e14;padding:.9rem 2.2rem;border-radius:1rem;font-size:1.3rem;font-weight:700;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 .6rem 2rem rgba(0,0,0,.5)}
#toast.acik{opacity:1}
</style>
</head>
<body>
<div id="acilis"><img src="icon-512.png" alt=""><span>Demet'in Sinema Odası</span></div>
<div class="arka" id="arkaA"></div><div class="arka" id="arkaB"></div><div id="perde"></div>

<header id="ust">
  <div class="marka"><img src="icon-192.png" alt=""><span>Demet'in Sinema Odası</span></div>
  <nav id="nav" class="satir" style="padding:0;overflow:visible">
    <button class="odak sekme secili" data-t="movie">Filmler</button>
    <button class="odak sekme" data-t="tv">Diziler</button>
    <button class="odak sekme" data-t="ara">Ara</button>
    <button class="odak sekme sag" data-t="ayar">⚙ Finduk</button>
    <span id="saat"></span>
  </nav>
</header>

<section id="kahraman">
  <div id="hEtiket"></div>
  <h1 id="hBaslik"></h1>
  <div id="hMeta"></div>
  <p id="hOzet"></p>
  <div id="hIpucu" hidden>▶&nbsp; Ayrıntılar için Tamam</div>
</section>

<main id="satirlar"></main>

<section id="arama" hidden>
  <div class="kutu satir" id="aramaSatiri" style="padding:0 4.4rem 1rem;overflow:visible"><input id="aramaKutu" class="odak" placeholder="Film ya da dizi adı yaz, Tamam'a bas" autocomplete="off"></div>
  <div id="aramaSonuc"></div>
</section>

<section id="detay" hidden>
  <div id="dArka"></div>
  <div id="dIc">
    <div id="dUst">
      <div id="dPoster"></div>
      <div id="dMetin">
        <h1 id="dBaslik"></h1>
        <div id="dMeta"></div>
        <p id="dOzet"></p>
        <div id="dKadro"></div>
        <div class="dugmeler satir" id="dPlat" style="padding:1.5rem 0 .3rem;overflow:visible"></div>
        <div class="not" id="dPlatNot"></div>
        <div class="dugmeler satir" id="dEk" style="padding:1rem 0 0;overflow:visible"></div>
      </div>
    </div>
    <div id="dBenzerKutu" hidden>
      <h3>Benzer yapımlar</h3>
      <div class="satir" id="dBenzer"></div>
    </div>
  </div>
</section>

<div id="toast"></div>

<script>
var API_KEY="91a5fe677d52ce465948f464c3cfd53b";
var BASE="https://api.themoviedb.org/3";
var IMG="https://image.tmdb.org/t/p/";
var $=function(i){return document.getElementById(i)};
var tur="movie";            /* movie | tv */
var mod="ana";              /* ana | ara | detay */
var ogeler={};              /* anahtar -> oge */
var kol=0;                  /* dikey gezinirken hatirlanan sutun */
var oncekiOdak=null;
var yuklemeNo=0;

function kacir(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ask(path,params){
  var url=BASE+path+"?api_key="+API_KEY+"&language=tr-TR";
  for(var k in params){if(params[k]!==""&&params[k]!=null)url+="&"+k+"="+encodeURIComponent(params[k])}
  var ctrl=("AbortController" in window)?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},12000);
  return fetch(url,ctrl?{signal:ctrl.signal}:undefined).then(function(r){
    clearTimeout(timer);
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  },function(e){clearTimeout(timer);throw e});
}
function norm(x,media){
  var m=x.media_type&&x.media_type!=="person"?x.media_type:media;
  return{id:x.id,media:m,baslik:x.title||x.name||"",
    yil:String(x.release_date||x.first_air_date||"").slice(0,4),
    puan:x.vote_average||0,ozet:x.overview||"",poster:x.poster_path,arka:x.backdrop_path};
}
function anahtar(o){return o.media+":"+o.id}

/* ---------- gorunum yardimcilari ---------- */
var toastT=0;
function toast(m){var t=$("toast");t.textContent=m;t.className="acik";clearTimeout(toastT);toastT=setTimeout(function(){t.className=""},3200)}
var katman=0;
function arkaYaz(yol){
  if(!yol)return;
  var src=IMG+"w1280"+yol, im=new Image();
  im.onload=function(){
    katman^=1;
    var yeni=$(katman?"arkaB":"arkaA"), eski=$(katman?"arkaA":"arkaB");
    yeni.style.backgroundImage="url("+src+")";
    yeni.className="arka acik";eski.className="arka";
  };
  im.src=src;
}
var heroT=0;
function heroGoster(o){
  clearTimeout(heroT);
  heroT=setTimeout(function(){
    var he=$("kahraman");he.className="";void he.offsetWidth;he.className="ge";
    $("hEtiket").textContent=(o.media==="tv"?"Dizi":"Film")+(o.sira?" · Bu hafta #"+o.sira:"");
    $("hIpucu").hidden=false;
    $("hBaslik").textContent=o.baslik;
    $("hMeta").innerHTML=(o.yil?"<span>"+kacir(o.yil)+"</span>":"")+(o.puan?'<span class="puan">★ '+o.puan.toFixed(1)+"</span>":"")+"<span>"+(o.media==="tv"?"Dizi":"Film")+"</span>";
    $("hOzet").textContent=o.ozet||"Bu yapım için Türkçe özet yok.";
    arkaYaz(o.arka||o.poster);
  },180);
}
function kartYap(o,sira){
  if(sira)o.sira=sira;
  anahtarKaydet(o);
  var b=document.createElement("button");
  b.className="odak kart"+(sira?" top"+(sira>=10?" dd":""):"");b.setAttribute("data-k",anahtar(o));
  var res=o.poster?'<img src="'+IMG+'w342'+o.poster+'" alt="">':'<div class="yok">'+kacir(o.baslik)+"</div>";
  var h;
  if(sira)h='<span class="sira">'+sira+'</span><div class="pst">'+res+"</div>";
  else h=res;
  if(o.puan)h+='<span class="pu">★ '+o.puan.toFixed(1)+"</span>";
  h+='<div class="ad">'+kacir(o.baslik)+"</div>";
  b.innerHTML=h;
  return b;
}
function anahtarKaydet(o){ogeler[anahtar(o)]=o}

/* ---------- ana sayfa satirlari ---------- */
var SAGLAYICI={netflix:8,disney:337,prime:119,hbo:1899,apple:350};
/* Demet'lerde aktif abonelikler (TV'de kurulu ve hesabi acik) */
var SAHIP=["netflix","disney","primevideo","amazon","turkcell","tvplus"];
function sahipMi(ad){var n=pNorm(ad);for(var i=0;i<SAHIP.length;i++){if(n.indexOf(SAHIP[i])>=0)return true}return false}
function satirTanimlari(t){
  var f=t==="movie";
  var d="/discover/"+t, tr={watch_region:"TR",with_watch_monetization_types:"flatrate",sort_by:"popularity.desc"};
  function plat(id){var p={};for(var k in tr)p[k]=tr[k];p.with_watch_providers=id;return p}
  var L=[["Bu hafta en çok izlenen 10","/trending/"+t+"/week",{},10]];
  if(f){
    L.push(["Kafa yormayan gerilim",d,{with_genres:53,"vote_average.gte":6.3,"vote_count.gte":400,"with_runtime.lte":115,sort_by:"popularity.desc"}]);
    L.push(["Eski klasikler",d,{"primary_release_date.lte":"1992-12-31","vote_average.gte":7.5,"vote_count.gte":1500,sort_by:"popularity.desc"}]);
    L.push(["İki saatten kısa, tam kıvamında",d,{"with_runtime.gte":75,"with_runtime.lte":120,"vote_average.gte":7.2,"vote_count.gte":2000,sort_by:"popularity.desc"}]);
  }else{
    L.push(["Türk dizileri",d,{with_original_language:"tr",sort_by:"popularity.desc","vote_count.gte":30}]);
    L.push(["Suç ve gerilim dizileri",d,{with_genres:80,"vote_average.gte":7,"vote_count.gte":300,sort_by:"popularity.desc"}]);
  }
  L.push(["Aboneliklerinde şimdi popüler",d,plat(SAGLAYICI.netflix+"|"+SAGLAYICI.disney+"|"+SAGLAYICI.prime)]);
  L.push(["Netflix'te",d,plat(SAGLAYICI.netflix)]);
  L.push(["Disney+'ta",d,plat(SAGLAYICI.disney)]);
  L.push(["Prime Video'da",d,plat(SAGLAYICI.prime)]);
  if(f){
    L.push(["Türk filmleri",d,{with_original_language:"tr",sort_by:"popularity.desc","vote_count.gte":50}]);
    L.push(["Gülmek isteyenlere",d,{with_genres:35,"vote_average.gte":6.8,"vote_count.gte":800,sort_by:"popularity.desc"}]);
  }
  return L;
}
function blokYap(baslik,liste,top){
  var s=document.createElement("section");s.className="blok";
  var h=document.createElement("h2");h.textContent=baslik;s.appendChild(h);
  var r=document.createElement("div");r.className="satir";
  liste.forEach(function(o,i){r.appendChild(kartYap(o,top?i+1:0))});
  s.appendChild(r);
  return s;
}
function anaYukle(){
  var no=++yuklemeNo, ana=$("satirlar");
  var isk="";for(var q=0;q<3;q++){isk+='<section class="blok iskelet"><h2></h2><div class="satir">';for(var z=0;z<9;z++)isk+='<div class="kart"></div>';isk+="</div></section>"}
  ana.innerHTML=isk;
  ana.scrollTop=0;
  var L=satirTanimlari(tur), ilk=true, hata=0, bitti=0;
  L.forEach(function(s,i){
    setTimeout(function(){
      if(no!==yuklemeNo)return;
      ask(s[1],s[2]).then(function(d){
        if(no!==yuklemeNo)return;
        var liste=(d.results||[]).filter(function(x){return x.poster_path}).slice(0,s[3]||18).map(function(x){return norm(x,tur)});
        if(!liste.length)return;
        if(ilk){ana.innerHTML="";ilk=false;acilisKapat()}
        var blok=blokYap(s[0],liste,!!s[3]);
        /* sira korunsun: tanim sirasina gore ekle */
        blok.setAttribute("data-s",i);
        var kardes=Array.prototype.slice.call(ana.children).filter(function(e){return e.hasAttribute("data-s")});
        var once=null;
        for(var j=0;j<kardes.length;j++){if(+kardes[j].getAttribute("data-s")>i){once=kardes[j];break}}
        ana.insertBefore(blok,once);
        if(ana.querySelectorAll(".kart").length===liste.length+(s[3]?0:0)){
          var k0=ana.querySelector(".kart");
          if(k0&&mod==="ana"&&(document.activeElement===document.body||!document.activeElement.classList.contains("odak"))){k0.focus();heroGoster(ogeler[k0.getAttribute("data-k")])}
        }
      }).catch(function(){hata++}).then(function(){
        bitti++;
        if(no===yuklemeNo&&bitti===L.length&&ilk){acilisKapat();ana.innerHTML='<div class="mesaj">Film listesi yüklenemedi. İnternet bağlantısını kontrol et.</div>'}
      });
    },i*120);
  });
}

/* ---------- arama ---------- */
function aramaYap(){
  var q=$("aramaKutu").value.trim();
  if(!q)return;
  var kutu=$("aramaSonuc");kutu.innerHTML='<div class="mesaj">Aranıyor…</div>';
  ask("/search/multi",{query:q,include_adult:"false"}).then(function(d){
    var l=(d.results||[]).filter(function(x){return(x.media_type==="movie"||x.media_type==="tv")&&x.poster_path}).map(function(x){return norm(x,x.media_type)});
    kutu.innerHTML="";
    if(!l.length){kutu.innerHTML='<div class="mesaj">Sonuç bulunamadı.</div>';return}
    for(var i=0;i<l.length&&i<28;i+=7){
      var r=document.createElement("div");r.className="satir";
      l.slice(i,i+7).forEach(function(o){r.appendChild(kartYap(o))});
      kutu.appendChild(r);
    }
    var k0=kutu.querySelector(".kart");if(k0){k0.focus();heroGoster(ogeler[k0.getAttribute("data-k")])}
  }).catch(function(){kutu.innerHTML='<div class="mesaj">Arama yapılamadı.</div>'});
}

/* ---------- detay ---------- */
function pNorm(a){return String(a||"").toLowerCase().replace(/ı/g,"i").replace(/[^a-z0-9]+/g,"")}
function jwAl(o){
  var q={query:"query($c:Country!,$l:Language!,$f:TitleFilter){popularTitles(country:$c,first:6,filter:$f){edges{node{objectType content(country:$c,language:$l){title externalIds{tmdbId}} offers(country:$c,platform:WEB){monetizationType standardWebURL package{clearName technicalName}}}}}}",
    variables:{c:"TR",l:"tr",f:{searchQuery:o.baslik}}};
  var ctrl=("AbortController" in window)?new AbortController():null;
  if(ctrl)setTimeout(function(){ctrl.abort()},6000);
  return fetch("https://apis.justwatch.com/graphql",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(q),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json()}).then(function(d){
      var ed=(d&&d.data&&d.data.popularTitles&&d.data.popularTitles.edges)||[];
      var tip=o.media==="tv"?"SHOW":"MOVIE";
      var hit=ed.map(function(e){return e.node}).filter(function(n){return n&&n.objectType===tip&&n.content&&n.content.externalIds&&String(n.content.externalIds.tmdbId)===String(o.id)})[0];
      var map={};
      ((hit&&hit.offers)||[]).forEach(function(of){
        if(!of||!of.standardWebURL||!of.package)return;
        [of.package.clearName,of.package.technicalName].forEach(function(nm){
          var n=pNorm(nm);if(!n)return;
          if(!map[n]||of.monetizationType==="FLATRATE")map[n]=of.standardWebURL;
        });
      });
      return map;
    }).catch(function(){return{}});
}
function tvGonder(plat,url,film){
  var ic=false;try{ic=(window.parent&&window.parent!==window)}catch(e){}
  if(!ic){toast("Film açma sadece TV uygulamasında çalışır");return}
  try{window.parent.postMessage({tip:"finduk-tv",platform:plat,url:url||"",film:film||""},"*")}catch(e){}
  toast(plat+" açılıyor: "+film);
}
function dugme(metin,logo,fn){
  var b=document.createElement("button");b.className="odak dugme";
  if(logo)b.innerHTML='<img src="'+IMG+'w92'+logo+'" alt="">';
  var s=document.createElement("span");s.textContent=metin;b.appendChild(s);
  b.onclick=fn;return b;
}
var dNo=0;
function detayAc(o){
  if(mod!=="detay")oncekiOdak=document.activeElement;
  mod="detay";
  var no=++dNo;
  $("detay").hidden=false;
  $("dBaslik").textContent=o.baslik;
  $("dMeta").innerHTML="";$("dOzet").textContent=o.ozet||"";$("dKadro").textContent="";
  $("dPoster").innerHTML=o.poster?'<img src="'+IMG+'w500'+o.poster+'" alt="">':"";
  $("dArka").style.backgroundImage=(o.arka||o.poster)?"url("+IMG+"w1280"+(o.arka||o.poster)+")":"";$("dBenzerKutu").hidden=true;$("dBenzer").innerHTML="";
  $("dPlat").innerHTML="";$("dEk").innerHTML="";$("dPlatNot").textContent="Platformlar kontrol ediliyor…";
  var yol="/"+o.media+"/"+o.id;
  Promise.all([
    ask(yol,{append_to_response:"credits,videos,watch/providers,recommendations",include_video_language:"tr,en,null"}),
    jwAl(o)
  ]).then(function(r){
    if(no!==dNo||mod!=="detay")return;
    var d=r[0],jw=r[1];
    var sure=o.media==="movie"?(d.runtime?d.runtime+" dk":""):((d.number_of_seasons||0)+" sezon");
    var turler=(d.genres||[]).slice(0,3).map(function(g){return g.name}).join(" · ");
    $("dMeta").innerHTML=(o.yil?"<span>"+kacir(o.yil)+"</span>":"")+(o.puan?'<span class="puan">★ '+o.puan.toFixed(1)+"</span>":"")+(sure?"<span>"+kacir(sure)+"</span>":"")+(turler?"<span>"+kacir(turler)+"</span>":"");
    $("dOzet").textContent=d.overview||o.ozet||"Bu yapım için Türkçe özet yok.";
    var kadro=((d.credits&&d.credits.cast)||[]).slice(0,6).map(function(c){return c.name}).join(", ");
    $("dKadro").textContent=kadro?"Oyuncular: "+kadro:"";
    var tr=(d["watch/providers"]&&d["watch/providers"].results&&d["watch/providers"].results.TR)||{};
    var seen={},hepsi=[].concat(tr.flatrate||[],tr.free||[],tr.ads||[]).filter(function(p){if(seen[p.provider_id])return false;seen[p.provider_id]=1;return true});
    var abone=hepsi.filter(function(p){return sahipMi(p.provider_name)}).slice(0,6);
    var baska=hepsi.filter(function(p){return !sahipMi(p.provider_name)}).slice(0,3).map(function(p){return p.provider_name}).join(", ");
    var P=$("dPlat");P.innerHTML="";
    abone.forEach(function(p,i){
      var url=jw[pNorm(p.provider_name)]||"";
      var db=dugme(i===0?"▶  "+p.provider_name+"'da izle":p.provider_name,p.logo_path,function(){tvGonder(p.provider_name,url,o.baslik)});
      if(i===0)db.classList.add("birincil");
      P.appendChild(db);
    });
    if(abone.length){$("dPlatNot").textContent="Tamam'a bas, TV'de o uygulama filmle birlikte açılsın."}
    else{
      var kira=[].concat(tr.rent||[],tr.buy||[]).slice(0,4).map(function(p){return p.provider_name}).join(", ");
      $("dPlatNot").textContent=baska?"Senin aboneliklerinde yok. Şurada var: "+baska+".":(kira?"Aboneliklerinde yok. Kiralama ya da satın alma: "+kira+".":"Türkiye'de şu an hiçbir dijital platformda görünmüyor.");
    }
    var E=$("dEk");E.innerHTML="";
    var vids=((d.videos&&d.videos.results)||[]).filter(function(v){return v.site==="YouTube"&&(v.type==="Trailer"||v.type==="Teaser")});
    if(vids.length)E.appendChild(dugme("Fragmanı YouTube'da aç",null,function(){tvGonder("YouTube","https://www.youtube.com/watch?v="+vids[0].key,o.baslik+" fragman")}));
    E.appendChild(dugme("Geri dön",null,detayKapat));
    var rec=((d.recommendations&&d.recommendations.results)||[]).filter(function(x){return x.poster_path}).slice(0,12);
    if(rec.length){
      var B=$("dBenzer");B.innerHTML="";
      rec.forEach(function(x){B.appendChild(kartYap(norm(x,o.media),0))});
      $("dBenzerKutu").hidden=false;
    }
    var ilk=P.querySelector(".odak")||E.querySelector(".odak");if(ilk)ilk.focus();
  }).catch(function(){
    if(no!==dNo||mod!=="detay")return;
    $("dPlatNot").textContent="Ayrıntılar alınamadı.";
    var E=$("dEk");E.innerHTML="";E.appendChild(dugme("Geri dön",null,detayKapat));E.querySelector(".odak").focus();
  });
  /* hemen bir sey odakli olsun */
  setTimeout(function(){if(mod==="detay"&&!document.activeElement.classList.contains("odak")){var x=$("detay").querySelector(".odak");if(x)x.focus()}},50);
}
function detayKapat(){
  $("detay").hidden=true;mod=($("arama").hidden?"ana":"ara");dNo++;
  if(oncekiOdak&&document.body.contains(oncekiOdak))oncekiOdak.focus();
}

/* ---------- sekmeler ---------- */
function sekmeSec(t){
  var bt=document.querySelectorAll(".sekme");
  if(t==="ayar"){try{window.parent.postMessage({tip:"finduk-ayar"},"*")}catch(e){}return}
  Array.prototype.forEach.call(bt,function(b){b.classList.toggle("secili",b.getAttribute("data-t")===t)});
  if(t==="ara"){
    mod="ara";$("arama").hidden=false;$("satirlar").hidden=true;$("kahraman").style.opacity=.0;
    $("aramaKutu").focus();return;
  }
  $("arama").hidden=true;$("satirlar").hidden=false;$("kahraman").style.opacity=1;mod="ana";
  if(t!==tur||!$("satirlar").querySelector(".kart")){tur=t;anaYukle()}
  else{var k=$("satirlar").querySelector(".kart");if(k)k.focus()}
}
document.getElementById("nav").addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest(".sekme"):null;if(b)sekmeSec(b.getAttribute("data-t"));
});

/* ---------- uzaktan kumanda ile gezinme ---------- */
function satirlariTopla(){
  var R=[Array.prototype.slice.call(document.querySelectorAll("#nav .odak"))];
  if(mod==="detay"){
    R=[];
    ["dPlat","dEk","dBenzer"].forEach(function(id){var a=Array.prototype.slice.call($(id).querySelectorAll(".odak"));if(a.length)R.push(a)});
    return R;
  }
  if(mod==="ara"){
    R.push([$("aramaKutu")]);
    Array.prototype.forEach.call($("aramaSonuc").querySelectorAll(".satir"),function(r){var a=Array.prototype.slice.call(r.querySelectorAll(".odak"));if(a.length)R.push(a)});
    return R;
  }
  Array.prototype.forEach.call($("satirlar").querySelectorAll(".satir"),function(r){var a=Array.prototype.slice.call(r.querySelectorAll(".odak"));if(a.length)R.push(a)});
  return R;
}
function gorunur(el){
  var row=el.parentNode;
  if(row&&row.classList.contains("satir")&&row.id!=="nav"&&row.id!=="dPlat"&&row.id!=="dEk"){
    var hedef=el.offsetLeft-(row.clientWidth-el.offsetWidth)/2;
    row.scrollLeft=hedef<0?0:hedef;
    var blok=row.parentNode,ana=document.getElementById(mod==="ara"?"aramaSonuc":"satirlar");
    if(blok&&(blok.classList.contains("blok")||ana.id==="aramaSonuc")){
      var ust=(blok.classList.contains("blok")?blok:row).offsetTop-(blok.classList.contains("blok")?0:0);
      ana.scrollTop=Math.max(0,ust-(ana.id==="satirlar"?0:0));
    }
  }
}
document.addEventListener("focusin",function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains("kart")){
    gorunur(el);
    var o=ogeler[el.getAttribute("data-k")];if(o)heroGoster(o);
  }
});
function geri(){
  if(mod==="detay"){detayKapat();return}
  if(mod==="ara"){sekmeSec(tur);var s=document.querySelector('.sekme[data-t="'+tur+'"]');if(s)s.focus();return}
  var ic=false;try{ic=(window.parent&&window.parent!==window)}catch(e){}
  if(ic){try{window.parent.postMessage({tip:"finduk-geri"},"*")}catch(e){}}
}
document.addEventListener("keydown",function(e){
  var k=e.keyCode,a=document.activeElement,tag=a&&a.tagName;
  if(k===10009||k===27||(k===8&&tag!=="INPUT")){geri();e.preventDefault();return}
  if(k===13){
    if(tag==="INPUT"){aramaYap();e.preventDefault();return}
    if(a&&a.classList&&a.classList.contains("odak")){a.click();e.preventDefault()}
    return;
  }
  var dx=0,dy=0;
  if(k===37)dx=-1;else if(k===39)dx=1;else if(k===38)dy=-1;else if(k===40)dy=1;else return;
  if(tag==="INPUT"&&dx!==0)return;
  var R=satirlariTopla(),r=-1,c=-1;
  for(var i=0;i<R.length;i++){var j=R[i].indexOf(a);if(j>=0){r=i;c=j;break}}
  if(r<0){var f=(R[1]&&R[1][0])||R[0][0];if(f)f.focus();e.preventDefault();return}
  var nr=r,nc=c;
  if(dx){nc=c+dx;if(nc<0||nc>=R[r].length){e.preventDefault();return};kol=nc}
  else{
    nr=r+dy;if(nr<0||nr>=R.length){e.preventDefault();return}
    nc=Math.min(kol,R[nr].length-1);
    if(nr===0&&mod!=="detay"){var s=document.querySelector('.sekme[data-t="'+(mod==="ara"?"ara":tur)+'"]');nc=Math.max(0,R[0].indexOf(s))}
    if(r===0&&mod!=="detay")nc=Math.min(kol,R[nr].length-1);
  }
  var hedef=R[nr][nc];
  if(hedef){hedef.focus();e.preventDefault()}
},true);
document.addEventListener("click",function(e){
  var k=e.target.closest?e.target.closest(".kart"):null;
  if(k){var o=ogeler[k.getAttribute("data-k")];if(o)detayAc(o)}
});

var acilisT0=Date.now(),acilisGitti=false;
function acilisKapat(){
  if(acilisGitti)return;acilisGitti=true;
  var bekle=Math.max(0,1500-(Date.now()-acilisT0));
  setTimeout(function(){var a=$("acilis");a.className="git";setTimeout(function(){a.style.display="none"},800)},bekle);
}
setTimeout(acilisKapat,9000);
function saatYaz(){var d=new Date(),h=d.getHours(),m=d.getMinutes();$("saat").textContent=(h<10?"0":"")+h+":"+(m<10?"0":"")+m}
saatYaz();setInterval(saatYaz,20000);
anaYukle();
</script>
